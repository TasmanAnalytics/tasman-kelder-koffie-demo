cription": "Number of days between shipment and successful delivery."}]}, "fct_subscription_events": {"table": "fct_subscription_events", "columns": [{"name": "subscription_event_id", "type": "string", "description": "Unique identifier for each individual subscription lifecycle event occurrence."}, {"name": "subscription_key", "type": "string", "description": "Business identifier linking event to specific customer subscription account."}, {"name": "event_type", "type": "string", "description": "Category of subscription lifecycle action such as started, cancelled, or renewed."}, {"name": "occurred_at", "type": "time", "description": "Precise timestamp when the subscription event took place."}, {"name": "event_month", "type": "time", "description": "Calendar month aggregation level for the event occurrence date."}, {"name": "source", "type": "string", "description": "System or channel that originated or recorded the subscription event."}, {"name": "cancellation_reason", "type": "string", "description": "Explanation or category code for why subscription was terminated."}, {"name": "is_voluntary_cancellation", "type": "boolean", "description": "Indicates whether customer actively chose to cancel versus involuntary termination."}, {"name": "billing_cycle_date", "type": "time", "description": "Scheduled date for recurring subscription payment processing."}, {"name": "recovered_at", "type": "time", "description": "Timestamp when previously cancelled subscription was reactivated or reinstated."}, {"name": "is_recovered_within_30_days", "type": "boolean", "description": "Flag indicating subscription reactivation occurred within thirty days of cancellation."}, {"name": "is_gift", "type": "boolean", "description": "Denotes whether subscription was purchased as gift for another recipient."}]}, "fct_subscriptions": {"table": "fct_subscriptions", "columns": [{"name": "subscription_key", "type": "string", "description": "Unique identifier combining origin system prefix and contract identifier for each subscription record."}, {"name": "customer_id", "type": "number", "description": "Links subscription to specific customer account in the system."}, {"name": "origin_system", "type": "string", "description": "Source platform where subscription was created, either Shopify or Recharge."}, {"name": "shopify_contract_id", "type": "number", "description": "Shopify's internal identifier for the subscription contract."}, {"name": "recharge_subscription_id", "type": "number", "description": "Recharge platform's internal identifier for the subscription."}, {"name": "started_at", "type": "time", "description": "Timestamp when customer initiated and activated the subscription."}, {"name": "churned_at", "type": "time", "description": "Timestamp when customer cancelled or stopped renewing their subscription."}, {"name": "ended_at", "type": "time", "description": "Timestamp when subscription definitively terminated and stopped billing."}, {"name": "status", "type": "string", "description": "Current lifecycle state of subscription: active, paused, or cancelled."}, {"name": "cancellation_reason", "type": "string", "description": "Customer-provided or system-recorded explanation for why subscription was terminated."}, {"name": "is_gift", "type": "boolean", "description": "Indicates whether subscription was purchased as gift for another recipient."}, {"name": "interval_days", "type": "number", "description": "Number of days between recurring deliveries and billing cycles."}, {"name": "quantity", "type": "number", "description": "Number of product units included in each subscription delivery."}, {"name": "variant_id", "type": "number", "description": "Specific product variant identifier for subscribed coffee type and size."}, {"name": "sku", "type": "string", "description": "Stock keeping unit code identifying exact product configuration."}, {"name": "product_title", "type": "string", "description": "Human-readable name of subscribed coffee product."}, {"name": "price_eur", "type": "number", "description": "Per-delivery charge in euros for subscribed product quantity."}, {"name": "mrr_eur", "type": "number", "description": "Monthly recurring revenue normalized to 30-day period in euros."}, {"name": "payment_method", "type": "string", "description": "Customer's payment type: card, mandate, or other billing method."}, {"name": "origin_order_id", "type": "number", "description": "Initial order identifier that created this subscription relationship."}, {"name": "first_order_channel", "type": "string", "description": "Marketing or sales channel through which customer originally subscribed."}]}, "metrics_cac_monthly": {"table": "metrics_cac_monthly", "columns": [{"name": "month", "type": "time", "description": "First day of the month for which acquisition metrics are aggregated and reported."}, {"name": "channel", "type": "string", "description": "Marketing channel type used for customer acquisition such as paid search or paid social."}, {"name": "platform", "type": "string", "description": "Advertising platform where campaigns ran such as Google or Meta."}, {"name": "ad_spend_eur", "type": "number", "description": "Total advertising expenditure in euros invested during the month for the channel and platform."}, {"name": "new_subscribers", "type": "number", "description": "Count of new subscribers acquired through the channel and platform during the month."}, {"name": "cac_eur", "type": "number", "description": "Customer acquisition cost in euros calculated by dividing ad spend by new subscribers acquired."}]}, "metrics_email_attribution_daily": {"table": "metrics_email_attribution_daily", "columns": [{"name": "day", "type": "time", "description": "Calendar date for the daily aggregated metrics."}, {"name": "emails_received", "type": "number", "description": "Total count of emails delivered to recipients' inboxes."}, {"name": "emails_opened", "type": "number", "description": "Number of emails opened by recipients."}, {"name": "emails_clicked", "type": "number", "description": "Count of emails where recipients clicked any link."}, {"name": "placed_orders", "type": "number", "description": "Total orders placed by all customers regardless of email interaction."}, {"name": "placed_order_revenue_eur", "type": "number", "description": "Total revenue in euros from all placed orders."}, {"name": "attributed_orders", "type": "number", "description": "Orders directly attributed to email campaign interactions."}, {"name": "attributed_revenue_eur", "type": "number", "description": "Revenue in euros from orders attributed to email campaigns."}]}, "metrics_new_subscribers_monthly": {"table": "metrics_new_subscribers_monthly", "columns": [{"name": "month", "type": "time", "description": "First day of the calendar month for which subscriber metrics are aggregated."}, {"name": "new_subscribers", "type": "number", "description": "Total count of all new subscribers acquired during the month regardless of payment status."}, {"name": "new_subscribers_paid", "type": "number", "description": "Count of new subscribers who started with a paid subscription during the month."}, {"name": "new_subscribers_unpaid", "type": "number", "description": "Count of new subscribers who started without payment or on free tier during month."}, {"name": "new_subscribers_without_web_order", "type": "number", "description": "Count of new subscribers acquired through non-web channels without associated web purchase orders."}]}, "metrics_pause_rate_monthly": {"table": "metrics_pause_rate_monthly", "columns": [{"name": "month", "type": "time", "description": "First day of the calendar month for which pause metrics are aggregated and reported."}, {"name": "base_subscribers", "type": "number", "description": "Total count of active subscribers eligible to pause at the beginning of the month."}, {"name": "paused_at_month_start", "type": "number", "description": "Number of subscribers already in paused status when the month began."}, {"name": "pauses_started", "type": "number", "description": "Count of new subscription pauses initiated by subscribers during this specific month."}, {"name": "pause_rate", "type": "number", "description": "Ratio of new pauses started to base subscribers, indicating monthly pause adoption percentage."}, {"name": "paused_share", "type": "number", "description": "Proportion of total subscribers in paused status relative to the base subscriber population."}]}, "metrics_subscriber_churn_monthly": {"table": "metrics_subscriber_churn_monthly", "columns": [{"name": "month", "type": "time", "description": "First day of the calendar month for which churn metrics are calculated and reported."}, {"name": "base_subscribers", "type": "number", "description": "Total active subscriber count at the beginning of the month before any cancellations occurred."}, {"name": "churned_subscribers", "type": "number", "description": "Number of subscribers who cancelled or terminated their subscription during the month."}, {"name": "churn_rate", "type": "number", "description": "Percentage of base subscribers lost, calculated as churned subscribers divided by base subscribers."}]}}}, {"key": "with_context", "label": "With context", "blurb": "Decision records, glossary and changelog ingested. The state the talk treats as correct.", "ingest": {"ktx_version": "@kaelio/ktx 0.16.0", "started": "2026-09-24T16:21:09", "finished": "2026-09-24T16:29:03", "enrichment": "llm", "embeddings": "sentence-transformers all-MiniLM-L6-v2 (384)"}, "wiki": [{"key": "0001-currency-eur-including-vat", "path": "global/0001-currency-eur-including-vat.md", "title": "0001: Report money in EUR, including VAT", "summary": "Establishes that all financial reporting must be in EUR with VAT included, reflecting shop prices as displayed, with finance handling net conversions as needed.", "tags": ["financial reporting", "currency", "VAT", "revenue", "pricing"], "sl_refs": [], "usage": "auto", "body": "# 0001: Report money in EUR, including VAT\n\nDate: 2025-01-09 · Status: accepted · Owner: Sanne (data)\n\nAll sales are in EUR and shop prices include VAT (9% coffee, 21% equipment). Revenue, MRR and order\nvalues are reported including VAT, as the shop shows them. Finance converts to net where needed.", "hash": "69ce6eda4e"}, {"key": "0002-one-subscription-key", "path": "global/0002-one-subscription-key.md", "title": "0002: One subscription key, status unified in one model", "summary": "Establishes that subscriptions maintain a single key throughout their lifecycle, with billing system statuses unified into four states (active, paused, cancelled, expired) in the int_subscriptions_unified model, serving as the authoritative status source for all downstream models.", "tags": ["subscriptions", "status mapping", "billing systems", "data modeling", "unified state"], "sl_refs": ["int_subscriptions_unified"], "usage": "auto", "body": "# 0002: One subscription key, status unified in one model\n\nDate: 2025-01-16 · Status: accepted · Owner: Sanne (data)\n\nA subscription keeps one key for its whole life. Statuses from the billing systems are mapped to\nactive, paused, cancelled and expired in `int_subscriptions_unified` and nowhere else. Every other\nmodel reads the unified status or the event stream.", "hash": "c3d69d6cdc"}, {"key": "0003-pause-is-not-churn", "path": "global/0003-pause-is-not-churn.md", "title": "0003: A pause is not churn", "summary": "Defines that paused subscriptions are not counted as churn and remain in the subscriber base; churn is only recorded when a subscriber cancels after a pause.", "tags": ["subscriptions", "churn", "pause", "retention", "metrics"], "sl_refs": [], "usage": "auto", "body": "# 0003: A pause is not churn\n\nDate: 2025-02-11 · Status: accepted · Owner: Sanne (data)\n\nPaused subscriptions stay in the base and never count as churned. A subscriber who cancels after a\npause churns in the month of the cancellation.", "hash": "9ec1f1cb09"}, {"key": "0004-email-attribution-window", "path": "global/0004-email-attribution-window.md", "title": "0004: Email attribution window is five days after a click", "summary": "Defines the email attribution window as five days following a click event from the same Klaviyo profile, computed directly from Klaviyo events rather than using Klaviyo's attributed_message_id field.", "tags": ["email attribution", "Klaviyo", "click events", "attribution window", "data definition"], "sl_refs": ["Klaviyo"], "usage": "auto", "body": "# 0004: Email attribution window is five days after a click\n\nDate: 2025-03-04 · Status: accepted · Owner: Sanne (data), agreed with Joris (retention)\n\nAn order is email-attributed if the same Klaviyo profile clicked an email in the five days before\nit. Opens do not count. We compute this ourselves from Klaviyo events rather than using Klaviyo's\nattributed_message_id, so the rule is visible in SQL.", "hash": "317ce3f842"}, {"key": "0005-channel-grouping", "path": "global/0005-channel-grouping.md", "title": "0005: Channel grouping from the first order", "summary": "Defines channel grouping taxonomy (paid_social, paid_search, email, organic, referral, direct) derived from UTM parameters and referrer data, with subscriber acquisition channel determined by the checkout order that initiated the subscription.", "tags": ["channel attribution", "UTM parameters", "acquisition channel", "subscriber lifecycle"], "sl_refs": [], "usage": "auto", "body": "# 0005: Channel grouping from the first order\n\nDate: 2025-06-02 · Status: accepted · Owner: Sanne (data)\n\nChannels are paid_social, paid_search, email, organic, referral and direct, from UTM parameters on\nthe landing site first and the referrer second. A subscriber's acquisition channel is the channel of\nthe checkout order that started the subscription.", "hash": "b943475f5e"}, {"key": "0006-gift-subscriptions-zero-mrr", "path": "global/0006-gift-subscriptions-zero-mrr.md", "title": "0006: Gift subscriptions carry zero MRR and sit outside the churn base", "summary": "Defines that gift subscriptions are prepaid for three shipments with zero MRR and are excluded from churn calculations and the churn base.", "tags": ["gift subscriptions", "MRR", "churn", "revenue recognition", "prepaid"], "sl_refs": [], "usage": "auto", "body": "# 0006: Gift subscriptions carry zero MRR and sit outside the churn base\n\nDate: 2025-11-18 · Status: accepted · Owner: Sanne (data), agreed with Femke (finance)\n\nGift subscriptions are prepaid for three shipments and then expire. The purchase is revenue once, at\ncheckout. Their MRR is zero by design, and they are excluded from the churn base and from churn.", "hash": "e4358ca4b1"}, {"key": "0007-recharge-migration-churn-artifacts", "path": "global/0007-recharge-migration-churn-artifacts.md", "title": "0007: Recharge migration wrote false churn events", "summary": "Documents a data quality issue where a Recharge subscription migration on March 12 incorrectly wrote false churn events for ~1,900 paused subscriptions, with the decision to flag affected rows and report both raw and adjusted churn metrics for March 2026.", "tags": ["data quality", "migration", "churn metrics", "Recharge", "billing"], "sl_refs": ["Recharge"], "usage": "auto", "body": "# 0007: Recharge migration wrote false churn events\n\nDate: 2026-03-14 · Status: accepted · Owner: Sanne (data)\n\n## Context\n\nThe 12 March billing migration backfilled Recharge subscription\nstatuses. Recharge has no \"paused\" state in the legacy import path,\nso ~1,900 paused subscriptions arrived as \"cancelled\", writing\nchurned_at timestamps that never happened.\n\n## Decision\n\nFlag affected rows with is_migration_artifact = true. Exclude\nflagged rows from churn metrics. Report both raw and adjusted\nchurn for March 2026 in any board-facing number.\n\n## Rejected alternative\n\nDeleting the rows. Finance reconciles against Recharge exports,\nso the raw record must match source.\n\n## Consequences\n\nMarch raw churn (9.4%) and adjusted churn (3.3%) will both exist.\nAnyone quoting March churn without the adjustment is wrong.", "hash": "8e3c03440d"}, {"key": "0008-restores-are-continuations", "path": "global/0008-restores-are-continuations.md", "title": "0008: Legacy pause restores are continuations", "summary": "Defines how legacy pause subscriptions wiped during the 12 March migration are restored as new Recharge subscriptions marked with restore_source = legacy_pause, maintaining original subscription identity and tenure rather than being treated as new acquisitions.", "tags": ["subscription management", "migration", "pause restores", "Recharge", "legacy data"], "sl_refs": ["Recharge subscriptions"], "usage": "auto", "body": "# 0008: Legacy pause restores are continuations\n\nDate: 2026-03-17 · Status: accepted · Owner: Sanne (data)\n\nOperations re-creates subscriptions whose pause the 12 March migration wiped (decision 0007) as new\nRecharge subscriptions, marked `restore_source = legacy_pause`. A restore continues the original\nsubscription: same key, same tenure. It is not a new subscriber and not acquisition. See\n`quirks/legacy_pause_restores.md`.", "hash": "bb018e7d33"}, {"key": "0009-churn-v2-dunning-grace", "path": "global/0009-churn-v2-dunning-grace.md", "title": "0009: Churn v2, 30-day dunning grace", "summary": "Defines Churn v2 methodology effective May 1, 2026, which counts failed payments as churn only if unrecovered within 30 days, replacing v1 which counted failures immediately, with parallel as-reported and restated historical series for comparison.", "tags": ["churn", "dunning", "payment recovery", "metrics definition", "financial reporting"], "sl_refs": [], "usage": "auto", "body": "# 0009: Churn v2, 30-day dunning grace\n\nDate: 2026-04-28 · Status: accepted · Owner: Sanne (data), agreed with Femke (finance)\n\n## Context\n\nUnder v1 a failed payment counts as churn on the day it fails.\nRecharge dunning retries recover a material share of failed\npayments within 30 days, so v1 overstated losses.\n\n## Decision\n\nFrom 1 May 2026, a failed payment counts as churn only if it is\nnot recovered within 30 days, attributed to the month of the\nfirst failure. The as-reported series keeps v1 for months before\nMay. A restated v2 series covers all months for like-for-like\ncomparisons.\n\n## Rejected alternative\n\nSilently restating all history under v2, because board decks had\nalready quoted v1 figures.\n\n## Consequences\n\n- Churn falls on 1 May for definitional reasons, by roughly half a\n  percentage point on Q1 2026 recoveries.\n- Comparisons across 1 May must use the restated series.\n- The most recent month is provisional under v2 until 30 days have\n  passed, and will be revised upward.", "hash": "e090da03a9"}, {"key": "churn-definition-versions", "path": "global/churn-definition-versions.md", "title": "churn-definition-versions", "summary": "Subscriber churn metric definition versions: v1 (before May 2026) vs v2 (from May 2026)", "tags": ["finance", "metrics"], "sl_refs": ["metrics_subscriber_churn_monthly"], "usage": "auto", "body": "## Subscriber Churn Definition Versions\n\nKelder's subscriber churn metric has two definition versions:\n\n### v1 (before May 2026)\n- **Base**: Subscriptions active or paused at 00:00 Amsterdam time on the first of the month, excluding gift subscriptions\n- **Churned**: Voluntary cancellations in the month\n\n### v2 (from May 2026)\n- **Base**: Same as v1\n- **Churned**: Voluntary cancellations in the month **plus failed payments that did not recover within 30 days**\n\n### Using the Metrics\n- **As-reported series** (`churn_rate_as_reported`): Uses v1 before May 2026, v2 from May 2026. The definition changes on 1 May 2026.\n- **Like-for-like comparisons**: Use `churn_rate_v2_restated` which applies v2 consistently across all months.\n- **Latest month**: Marked as `is_provisional = true`. v2 churn will be revised upward as failed payments pass 30 days.\n- **Raw columns**: Include migration artifacts (see migration-artifacts page). Never report raw churn without the adjusted rate.\n\n### Source\n`metrics_subscriber_churn_monthly` table contains all versions. See `context_metric_changelog` for the full decision record.", "hash": "f8460809ef"}, {"key": "context-business-events", "path": "global/context-business-events.md", "title": "context-business-events", "summary": "context_business_events table documents dated events that moved metrics (migrations, promotions, outages, definition changes, logistics)", "tags": ["context", "data-quality"], "sl_refs": [], "usage": "auto", "body": "## context.business_events\n\n### Purpose\nThe `context_business_events` table documents **dated events that moved a metric**: migrations, promotions, outages, definition changes, and logistics events.\n\n**Check this table before explaining any anomaly in a metric.**\n\n### Schema\n- `event_date`: Date the event started (local date)\n- `event_type`: `migration`, `promo`, `outage`, `definition_change`, or `logistics`\n- `title`: Short title\n- `description`: What happened and what it does to the numbers\n- `affected_metrics`: Metrics the event moves (array of metric names)\n- `expected_effect`: Expected direction (`up`, `down`, `gap`, `none`), with a qualifier where the effect is not real\n- `owner`: Person who owns the event record\n- `source_link`: Decision record, Linear ticket, Slack thread, or Notion page with the detail\n\n### Examples\n- **2026-03-12 migration**: Recharge backfill created migration artifacts (see migration-artifacts-2026-03-12)\n- **2026-04-09 outage**: Klaviyo connector outage (see klaviyo-outage-april-2026)\n- **2026-05-18 logistics**: PostNL strike (see postnl-strike-may-2026)\n- **2026-05-01 definition_change**: Churn metric v2 (see churn-definition-versions)\n\n### Source\nSeeded from `seeds/context/business_events.csv` and rendered to the `context_business_events` model.", "hash": "29af5a7ee2"}, {"key": "context-metric-changelog", "path": "global/context-metric-changelog.md", "title": "context-metric-changelog", "summary": "context_metric_changelog table documents versioned metric definitions and why they changed", "tags": ["context", "metrics"], "sl_refs": [], "usage": "auto", "body": "## context.metric_changelog\n\n### Purpose\nThe `context_metric_changelog` table documents **versioned metric definitions**. When a metric's definition changes, add a row here and a decision record.\n\n### Schema\n- `metric`: Metric name\n- `version`: Definition version (`v1`, `v2`, etc.)\n- `valid_from`: First month the definition applies to in the as-reported series\n- `valid_to`: Day before the next version starts (empty for the current version)\n- `definition`: The definition in words\n- `reason_for_change`: Why the definition changed\n- `is_current`: True for the version in force now\n\n### Example: Subscriber Churn\n- **v1** (valid_from 2025-01-01, valid_to 2026-04-30): Voluntary cancellations only\n- **v2** (valid_from 2026-05-01, is_current = true): Voluntary cancellations + failed payments not recovered within 30 days\n\nSee churn-definition-versions for the full churn metric documentation.\n\n### Source\nSeeded from `seeds/context/metric_changelog.csv` and rendered to the `context_metric_changelog` model and `context/metric_changelog.md`.", "hash": "a6868c9c5c"}, {"key": "dbt-data-tests", "path": "global/dbt-data-tests.md", "title": "dbt-data-tests", "summary": "dbt data tests document uniqueness, not-null constraints, accepted values, and relationships", "tags": ["dbt", "data-quality"], "sl_refs": [], "usage": "auto", "body": "## dbt Data Tests\n\n### Test Types\n\n#### Uniqueness and Not-Null\nPrimary keys are tested with `unique` and `not_null`:\n- `dim_customers.customer_id`\n- `fct_orders.order_id`\n- `fct_subscriptions.subscription_key`\n- `fct_subscription_events.subscription_event_id`\n- All staging model primary keys\n\n#### Accepted Values\nEnum-like fields are tested with `accepted_values`:\n- **Countries**: `['NL', 'BE', 'DE', 'LU', 'FR']`\n- **Product types**: `['single_origin', 'blend', 'decaf', 'equipment', 'gift_box', 'gift_subscription', 'bundle']`\n- **Order source**: `['web', 'subscription_contract', 'recharge']`\n- **Channels**: `['paid_social', 'paid_search', 'email', 'organic', 'referral', 'direct']`\n- **Subscription status**: `['active', 'paused', 'cancelled', 'expired']`\n- **Event types**: `['started', 'paused', 'resumed', 'cancelled', 'expired', 'payment_failed', 'payment_recovered']`\n- **Carriers**: `['PostNL', 'DHL']`\n- **Financial status**: `['paid', 'refunded', 'partially_refunded']`\n\n#### Relationships\nForeign keys are tested with `relationships`:\n- `fct_orders.customer_id` → `dim_customers.customer_id`\n- `fct_subscriptions.customer_id` → `dim_customers.customer_id`\n- `fct_subscription_events.subscription_key` → `fct_subscriptions.subscription_key`\n- Staging models have relationships to their parent tables\n\n#### Unique Combinations\nComposite keys are tested with `unique_combination`:\n- `metrics_cac_monthly`: `[month, channel]`\n- `stg_ads__ad_spend_daily`: `[spend_date, platform, campaign_id]`\n- `int_charges_unified`: `[source_system, source_id]`\n- `int_payment_episodes`: `[subscription_key, billing_cycle_date]`\n\n### Test Metadata in Semantic Layer\nThe semantic layer overlays include test metadata in `constraints.dbt`:\n- `not_null: true`\n- `unique: true`\n\nThis metadata is visible to the query assistant and helps with data quality understanding.\n\n### Source\nSee all `_models.yml` files for the full test suite.", "hash": "a8a94a0d52"}, {"key": "email-attribution-window", "path": "global/email-attribution-window.md", "title": "email-attribution-window", "summary": "Email-attributed revenue uses a 5-day attribution window from click to order", "tags": ["email", "attribution"], "sl_refs": ["metrics_email_attribution_daily"], "usage": "auto", "body": "## Email Attribution Window\n\n### Attribution Logic\nAn order is **email-attributed** if the same Klaviyo profile clicked an email within the **five days** before placing the order.\n\n### Data Source\n- **Klaviyo events**: `Clicked Email` and `Placed Order` events per profile\n- **Attribution**: Klaviyo's own `attributed_message_id` field\n- **Window**: 5 days before the order\n\n### Metrics\n`metrics_email_attribution_daily` tracks:\n- `attributed_orders`: Placed Orders with a click in the previous 5 days\n- `attributed_revenue_eur`: Revenue from those orders\n\n### Data Quality\nSee the klaviyo-outage-april-2026 page for the April 2026 connector outage that caused incomplete attribution data through 15 April.\n\n### Source\nSee `metrics_email_attribution_daily` model for the attribution logic.", "hash": "ec9b655d26"}, {"key": "fivetran-sync-metadata", "path": "global/fivetran-sync-metadata.md", "title": "fivetran-sync-metadata", "summary": "Fivetran syncs Shopify, Recharge, Klaviyo, and Ads data with _fivetran_synced timestamps", "tags": ["data-pipeline", "data-quality"], "sl_refs": [], "usage": "auto", "body": "## Fivetran Sync Metadata\n\n### Data Sources\nKelder uses Fivetran to sync data from four sources:\n- **Shopify**: Store, orders, customers, subscription app (from January 2025)\n- **Recharge**: Subscription billing\n- **Klaviyo**: Email marketing\n- **Ads**: Meta Ads (Facebook/Instagram) and Google Ads\n\n### Sync Timestamps\nAll raw source tables have a `_fivetran_synced` column that records when Fivetran last synced the row. This is the `loaded_at_field` in dbt sources.\n\n### Sync Freshness\n- **Shopify subscription contracts**: `synced_at` column shows when Fivetran last synced the row (current state as of that timestamp)\n- **Recharge subscriptions**: `synced_at` column shows when Fivetran last synced the row\n\n### Known Outages\nSee klaviyo-outage-april-2026 for the April 2026 Klaviyo connector outage that caused incomplete data.\n\n### Data Completeness\n- **Shopify**: Complete from January 2025\n- **Recharge**: Complete from the 2026-03-12 migration (see migration-artifacts-2026-03-12)\n- **Klaviyo**: Complete except for the April 2026 outage\n- **Ads**: Complete daily data\n\n### Source\nSee all `_sources.yml` files for the `loaded_at_field` configuration.", "hash": "d92b81dfb1"}, {"key": "gift-subscriptions", "path": "global/gift-subscriptions.md", "title": "gift-subscriptions", "summary": "Gift subscriptions are prepaid for three shipments and excluded from subscriber metrics", "tags": ["subscriptions", "metrics"], "sl_refs": ["fct_subscriptions", "fct_subscription_events"], "usage": "auto", "body": "## Gift Subscriptions\n\n### Definition\nGift subscriptions are **prepaid** subscriptions purchased as gifts. They:\n- Are paid once at purchase for three shipments\n- Have `is_gift = true` in `fct_subscriptions` and `fct_subscription_events`\n- Have `mrr_eur = 0` by design (no recurring revenue)\n\n### Exclusion Rules\n**Always exclude gift subscriptions from**:\n- Subscriber base counts (active, paused, cancelled)\n- Churn metrics\n- MRR calculations\n- New subscriber counts\n- Acquisition metrics (CAC, channel attribution)\n\n### Identification\nFilter with `is_gift = false` or use the `non_gift` segment on `fct_subscriptions`.\n\n### Source\nSee `context/quirks/gift_subscriptions.md` for the full business logic.", "hash": "f02b7e8480"}, {"key": "gift_subscriptions", "path": "global/gift_subscriptions.md", "title": "Gift subscriptions", "summary": "Defines gift subscriptions as three-shipment prepaid products (SKU GIFT-SUB-3) that expire rather than churn, with zero MRR by design and flagged via is_gift attribute, excluding them from churn calculations and revenue recognition.", "tags": ["gift subscriptions", "prepaid", "churn exclusion", "MRR", "Shopify", "Recharge", "subscription lifecycle"], "sl_refs": ["fct_subscriptions"], "usage": "auto", "body": "# Gift subscriptions\n\nOwner: Sanne (data). Written 2026-06-15.\n\n- A gift subscription is prepaid for three shipments, four weeks apart. The buyer pays once at\n  checkout (SKU `GIFT-SUB-3`); the three shipments are zero-value renewal orders.\n- After the third shipment the subscription is `expired`, not cancelled. Expiry is not churn.\n- Gift subscriptions are excluded from the churn base and from churn, in every definition version.\n- `fct_subscriptions.mrr_eur` is zero for gifts by design (decision 0006). The revenue shows up once,\n  in the purchase order.\n- Gifts are flagged with `is_gift`: the Shopify contract custom attribute before March 2026, the\n  Recharge property from then. Recharge gifts are also `is_prepaid`.\n- Volumes: about 300 sold in December 2025 and about 450 in the Father's Day week, 14 to 21 June 2026\n  (context.business_events). Expect new customers and average order value to rise in those weeks\n  while MRR does not.", "hash": "e54622cfff"}, {"key": "glossary", "path": "global/glossary.md", "title": "Glossary", "summary": "A glossary defining key subscription and revenue metrics including base, churn (with versioned definitions), MRR, pause, gift subscriptions, restores, and email-attributed revenue, with notes on data adjustments and calculation methodologies.", "tags": ["subscription metrics", "churn", "MRR", "glossary", "definitions", "billing", "Recharge", "Klaviyo"], "sl_refs": [], "usage": "auto", "body": "# Glossary\n\nOwner: Sanne (data). Metric definitions live in `metric_changelog.md`; this page explains the terms.\n\n**Base.** Subscriptions in status active or paused at 00:00 Amsterdam time on the first day of the\nmonth. Gift subscriptions are never in the base.\n\n**Churn.** Churned in the month divided by the base. Churned means voluntary cancellations in the\nmonth plus failed payments, counted per the definition version:\n\n- **v1** (to April 2026): a subscription whose payment first failed in the month counts as churned\n  on the day of failure, whether or not a retry later recovers it.\n- **v2** (from May 2026): a failed payment counts only if it is not recovered within 30 days. It is\n  attributed to the month of the first failure. For the latest month, failures younger than 30 days\n  at the as-of date do not count yet, so the latest month is provisional and will be revised upward.\n\n**As reported versus restated.** The as-reported series is what we publish: v1 up to April 2026 and\nv2 from May 2026. The restated series is v2 for every month. Compare months across 1 May 2026 only\nwith the restated series (`churn_rate_v2_restated`), otherwise you compare two definitions.\n\n**Raw versus adjusted.** Raw counts the cancellations written by the 12 March 2026 billing migration\n(about 1,900 paused subscriptions imported as cancelled). Adjusted excludes them and treats the\naffected subscriptions as still paused until their restore. Adjusted is the real number. Raw exists\nso finance can reconcile against Recharge exports (decision 0007).\n\n**Pause.** A subscriber can pause for one, two, three or six months. A paused subscription is still\nin the base and is not churn. Recharge has no paused status: paused means `active` with\n`paused_until` set. From 28 March 2026 the cancel flow offers a pause first, so the pause rate rises.\n\n**Gift subscription.** Prepaid for three shipments, then `expired`. Outside the base and outside\nchurn. MRR is zero by design (decision 0006).\n\n**Restore.** A new Recharge subscription that operations created for a customer whose pause was wiped\nby the migration (`restore_source = legacy_pause`). A restore continues the original subscription's\nkey and tenure. It is not a new subscriber (decision 0008).\n\n**MRR.** Price per shipment, normalised to a month (x 365.25 / 12 / interval days), for active\nsubscriptions. Paused and ended subscriptions contribute zero. Gifts contribute zero.\n\n**Email-attributed revenue.** Value of Klaviyo Placed Order events where the same profile clicked an\nemail in the five days before the order (decision 0004). There is no Klaviyo data from\n2026-04-09 06:00 UTC to 2026-04-10 13:00 UTC, so 9 to 15 April 2026 are understated.\n\n**New subscribers.** Subscriptions started in the month, excluding gifts and restores.\n\n**CAC.** Paid channel ad spend in the month divided by new subscribers whose first order came through\nthat channel.", "hash": "920c36cc00"}, {"key": "kelder-dbt-project-structure", "path": "global/kelder-dbt-project-structure.md", "title": "kelder-dbt-project-structure", "summary": "Kelder dbt project structure: staging, intermediate, marts, and context layers with materialization strategy", "tags": ["dbt", "data-modeling"], "sl_refs": [], "usage": "auto", "body": "## Kelder dbt Project Structure\n\n### Project Configuration\n- **Name**: kelder\n- **Profile**: kelder\n- **Reporting date**: 2026-07-01 (metrics cover full months before this date)\n- **First reporting month**: 2025-01-01\n- **Reporting timezone**: Europe/Amsterdam\n\n### Layer Structure\n\n#### Staging (`+schema: staging`, `+materialized: view`)\nRaw source data cleaned and standardized:\n- `stg_shopify__*`: Shopify store and subscription app (synced by Fivetran from January 2025)\n- `stg_recharge__*`: Recharge subscription billing (synced by Fivetran)\n- `stg_klaviyo__*`: Klaviyo email marketing (synced by Fivetran)\n- `stg_ads__*`: Meta Ads and Google Ads daily performance (synced by Fivetran)\n\n#### Intermediate (`+schema: intermediate`, `+materialized: table`)\nBusiness logic and unification:\n- `int_subscriptions_unified`: Unified subscription status across Shopify and Recharge\n- `int_charges_unified`: Billing attempts from both systems\n- `int_payment_episodes`: Dunning episodes with recovery tracking\n- `int_subscription_events`: Unified event stream for governed metrics\n- `int_reporting_months`: Calendar months for reporting\n\n#### Marts (`+schema: main`, `+materialized: table`)\nAnalytics-ready fact and dimension tables:\n- `dim_customers`: Customer master data\n- `fct_orders`: Order transactions\n- `fct_subscriptions`: Subscription contracts\n- `fct_subscription_events`: Subscription lifecycle events\n- `metrics_*`: Governed monthly and daily metrics\n\n#### Context (`+schema: context`, `+materialized: table`)\nMetadata and documentation:\n- `context_business_events`: Dated events that moved metrics\n- `context_metric_changelog`: Versioned metric definitions\n\n#### Seeds (`+schema: reference`)\nReference data:\n- `countries`: Countries Kelder ships to with regions and carriers\n- `business_events`: Source CSV for context_business_events\n- `metric_changelog`: Source CSV for context_metric_changelog\n\n### Source\nSee `dbt_project.yml` for the full configuration.", "hash": "8b36eba0e2"}, {"key": "klaviyo-outage-april-2026", "path": "global/klaviyo-outage-april-2026.md", "title": "klaviyo-outage-april-2026", "summary": "Klaviyo connector outage 9-10 April 2026 caused incomplete email attribution data through 15 April", "tags": ["data-quality", "email"], "sl_refs": ["metrics_email_attribution_daily"], "usage": "auto", "body": "## Klaviyo Connector Outage (April 2026)\n\n### Event\nFivetran Klaviyo connector outage from 2026-04-09 06:00 UTC to 2026-04-10 13:00 UTC. Data was never backfilled.\n\n### Impact\n- **9-10 April**: Email activity figures (received, opened, clicked) are incomplete\n- **9-15 April**: Email-attributed revenue is **understated**\n  - Orders placed up to five days after the outage lost the clicks that would have attributed them\n  - The 5-day attribution window means the impact extends through 15 April\n\n### Data Completeness\n- **Shopify orders**: Complete (not affected)\n- **Klaviyo events**: Incomplete for 9-10 April\n- **Email attribution**: Understated through 15 April\n\n### Identification\n`metrics_email_attribution_daily.is_incomplete = true` for 9-15 April 2026.\n\n### Analysis Guidance\nWhen analyzing email attribution or revenue:\n- **Exclude 9-15 April 2026**, OR\n- **Call out the outage** when those days are included\n\n### Source\nSee `context_business_events` for the full event record.", "hash": "68fa6b4245"}, {"key": "legacy_pause_restores", "path": "global/legacy_pause_restores.md", "title": "Legacy pause restores", "summary": "Documents the legacy pause restoration process following the 12 March billing migration, which converted paused Shopify subscriptions to cancelled Recharge subscriptions, and describes how operations re-creates these subscriptions and how they should be treated in analytics.", "tags": ["billing migration", "pause restoration", "Recharge subscriptions", "data lineage", "subscription events"], "sl_refs": ["fct_subscriptions", "int_subscription_events_adjusted", "metrics_new_subscribers_monthly", "metrics_cac_monthly"], "usage": "auto", "body": "# Legacy pause restores\n\nOwner: Sanne (data). Written 2026-03-17.\n\n## What happened\n\nThe 12 March billing migration wiped every pause: subscriptions that were paused at the last\nShopify sync arrived in Recharge as cancelled (decision 0007). Those customers still expected\ncoffee when their pause ended.\n\nFrom 16 March an operations job re-creates each affected subscription on the original\n`pause_until` date, as a new Recharge subscription:\n\n- same customer, plan and product;\n- status `active`, `created_at` at the job's run time, 09:15 Amsterdam time on weekdays;\n- `properties` contains `{\"restore_source\": \"legacy_pause\", \"legacy_contract_id\": \"<Shopify contract id>\"}`;\n- first charge at the next 05:00 billing run.\n\nSubscriptions whose pause ends after the end of the data are not restored yet.\n\n## How to treat them\n\n- A restore is a continuation, not a new subscriber. `fct_subscriptions.is_legacy_pause_restore`\n  flags it and `continues_subscription_key` points at the original subscription.\n- The adjusted event stream (`int_subscription_events_adjusted`) moves the restore's events to the\n  original key. The original subscription counts as paused from its Shopify pause until the\n  restore is created.\n- `metrics_new_subscribers_monthly` and `metrics_cac_monthly` exclude restores.\n- A naive count of Recharge subscriptions created in March to June counts restores as new\n  subscribers. That overstates acquisition by roughly 1,600 subscriptions.", "hash": "5010c4d16d"}, {"key": "marketing-channel-attribution", "path": "global/marketing-channel-attribution.md", "title": "marketing-channel-attribution", "summary": "Web orders are attributed to marketing channels based on UTM parameters and referrer", "tags": ["marketing", "attribution"], "sl_refs": ["fct_orders", "fct_subscriptions", "metrics_new_subscribers_monthly", "metrics_cac_monthly"], "usage": "auto", "body": "## Marketing Channel Attribution\n\n### Channels\nWeb orders (not subscription renewals) are attributed to one of six channels:\n- `paid_social`: Paid social media (Meta/Facebook/Instagram)\n- `paid_search`: Paid search (Google Ads)\n- `email`: Email marketing (Klaviyo)\n- `organic`: Organic search\n- `referral`: Referral from another site\n- `direct`: Direct traffic\n\n### Attribution Logic\nChannel is determined from the order's `landing_site`, `referring_site`, and UTM parameters (`utm_source`, `utm_medium`, `utm_campaign`).\n\n### Subscription Renewals\nSubscription renewal orders have **empty channel** because they are created by the billing system, not a customer visit.\n\n### Data Model\n- `fct_orders.channel`: Marketing channel for web orders\n- `fct_orders.is_subscription_renewal`: True for renewals (empty channel)\n- `fct_subscriptions.first_order_channel`: Channel of the checkout order that started the subscription\n\n### Acquisition Metrics\nNew subscriber acquisition is attributed to the channel of the first order:\n- `metrics_new_subscribers_monthly`: Breaks down new subscribers by paid vs unpaid channels\n- `metrics_cac_monthly`: Customer acquisition cost for paid channels (paid_social, paid_search)\n\n### Source\nSee `stg_shopify__orders` for the channel attribution logic.", "hash": "5a3d38a306"}, {"key": "metric_changelog", "path": "global/metric_changelog.md", "title": "Metric changelog", "summary": "A changelog documenting the evolution of the subscriber_churn_rate metric, tracking definition changes and their effective dates from January 2025 onwards, including adjustments to how failed payments are counted in churn calculations.", "tags": ["metrics", "churn", "changelog", "subscriber", "definitions", "dunning"], "sl_refs": ["subscriber_churn_rate"], "usage": "auto", "body": "# Metric changelog\n\nGenerated from `seeds/context/metric_changelog.csv` by `scripts/render_metric_changelog.py`.\nDo not edit by hand. The same rows are in the warehouse as `context.metric_changelog`.\n\n## subscriber_churn_rate\n\n| Version | Valid from | Definition | Reason for change |\n|---|---|---|---|\n| v1 | 2025-01-01 | Cancelled in month / active at month start. Failed payments count as churn on day one | Initial definition |\n| v2 | 2026-05-01 | As v1, with a 30-day dunning grace before a failed payment counts as churn | Recharge dunning recovers a material share of failed payments; day-one counting overstated losses |", "hash": "0bb629f32e"}, {"key": "migration-artifacts-2026-03-12", "path": "global/migration-artifacts-2026-03-12.md", "title": "migration-artifacts-2026-03-12", "summary": "2026-03-12 Recharge migration artifacts: ~1,900 paused subscriptions incorrectly marked as cancelled", "tags": ["data-quality", "subscriptions"], "sl_refs": ["fct_subscriptions", "fct_subscription_events", "metrics_subscriber_churn_monthly"], "usage": "auto", "body": "## 2026-03-12 Recharge Migration Artifacts\n\n### What Happened\nDuring the 2026-03-12 Recharge backfill, approximately 1,900 subscriptions that were **paused** at the last Shopify sync arrived in Recharge as **cancelled** at 2026-03-12 00:00:00 UTC with no cancellation reason.\n\nThese subscriptions were not actually cancelled. They are migration artifacts.\n\n### Identification\nRows with `is_migration_artifact = true` in:\n- `fct_subscriptions`\n- `fct_subscription_events`\n- `metrics_subscriber_churn_monthly` (raw columns only)\n\n### Impact on Metrics\n- **Churn metrics**: Migration artifacts are **excluded** from adjusted churn metrics (`churn_rate_as_reported`, `churn_rate_v2_restated`).\n- **Raw columns**: Include migration artifacts for finance reconciliation against Recharge exports. Never report raw churn without the adjusted rate.\n- **Subscription counts**: Exclude `is_migration_artifact = true` when counting active/cancelled subscriptions.\n\n### Legacy Pause Restores\nSome affected customers had their subscriptions manually re-created by operations. These carry:\n- `is_legacy_pause_restore = true`\n- `continues_subscription_key` pointing to the original subscription\n\n**Exclude restores from**:\n- New subscriber counts (they continue an existing subscription)\n- Acquisition metrics (they are not new acquisitions)\n\n### Source\nDecision 0007 in the context tables. See `context_business_events` for the full timeline.", "hash": "2c5120ec7a"}, {"key": "postnl-strike-may-2026", "path": "global/postnl-strike-may-2026.md", "title": "postnl-strike-may-2026", "summary": "PostNL strike 18-24 May 2026 caused delivery delays and increased refund rates", "tags": ["data-quality", "logistics"], "sl_refs": ["fct_orders"], "usage": "auto", "body": "## PostNL Strike (18-24 May 2026)\n\n### Event\nPostNL strike from 18 to 24 May 2026 affected Dutch deliveries.\n\n### Impact\n- **Delivery times**: Dutch PostNL parcels shipped in that week took 3 to 7 days (vs normal 1-2 days)\n- **Failed deliveries**: About 1% were never delivered\n- **Refunds**: Late-delivery refunds rose to about 6% of those orders (vs normal ~1%)\n\n### Analysis Guidance\nWhen analyzing delivery times or refund rates:\n- **Exclude the week** of 18-24 May 2026, OR\n- **Call out the strike** when the week is included\n\nThe `delivery_days` column in `fct_orders` includes a caveat about this event.\n\n### Source\nSee `context_business_events` for the full event record.", "hash": "d8f81ce496"}, {"key": "product-types", "path": "global/product-types.md", "title": "product-types", "summary": "Kelder product types: single_origin, blend, decaf, equipment, gift_box, gift_subscription, bundle", "tags": ["products"], "sl_refs": [], "usage": "auto", "body": "## Kelder Product Types\n\n### Product Type Values\n`stg_shopify__products.product_type` and `stg_shopify__product_variants.product_type` have seven values:\n\n#### Coffee Products\n- **`single_origin`**: Single-origin coffee beans\n- **`blend`**: Coffee blends\n- **`decaf`**: Decaffeinated coffee\n\n#### Non-Coffee Products\n- **`equipment`**: Coffee equipment (grinders, brewers, etc.)\n- **`gift_box`**: Gift boxes (e.g., Christmas gift boxes)\n- **`gift_subscription`**: Prepaid gift subscriptions (three shipments)\n- **`bundle`**: Product bundles (e.g., Vaderdag Bundel)\n\n### Usage\n- Coffee products: `product_type IN ('single_origin', 'blend', 'decaf')`\n- Gift products: `product_type IN ('gift_box', 'gift_subscription')`\n- Subscription products: Coffee types + gift_subscription\n\n### Related\nSee gift-subscriptions for how gift subscriptions are handled in metrics.\n\n### Source\nSee `stg_shopify__products` for the product type field.", "hash": "7f6634f2f7"}, {"key": "refund-reasons", "path": "global/refund-reasons.md", "title": "refund-reasons", "summary": "Refund reasons are entered by customer service in the refund_note field", "tags": ["refunds", "customer-service"], "sl_refs": ["fct_orders"], "usage": "auto", "body": "## Refund Reasons\n\n### Refund Note Field\nWhen customer service issues a refund, they enter a reason in `stg_shopify__refunds.refund_note` and `fct_orders` (via the first refund).\n\n### Common Reasons\nExamples from the dbt documentation:\n- **`late_delivery`**: Order arrived late\n- **`wrong_grind`**: Wrong grind size shipped\n\n### Usage\n- Refund analysis: Group by `refund_note` to understand refund drivers\n- Late delivery tracking: Filter for `refund_note = 'late_delivery'`\n- Quality issues: Look for product-related reasons like `wrong_grind`\n\n### Related Events\nSee postnl-strike-may-2026 for the May 2026 event that caused late-delivery refunds to spike to ~6% of orders in that week.\n\n### Data Sources\n- `stg_shopify__refunds.refund_note`: Reason entered by customer service\n- `fct_orders.first_refunded_at`: Timestamp of first refund\n- `fct_orders.refunded_eur`: Total refunded amount\n- `fct_orders.is_refunded`: Boolean flag for any refund\n\n### Source\nSee `stg_shopify__refunds` for the refund_note field.", "hash": "7df77a84c1"}, {"key": "shipping-countries-regions", "path": "global/shipping-countries-regions.md", "title": "shipping-countries-regions", "summary": "Kelder ships to five countries (NL, BE, DE, LU, FR) grouped into three reporting regions", "tags": ["logistics", "geography"], "sl_refs": ["dim_customers", "fct_orders"], "usage": "auto", "body": "## Shipping Countries and Regions\n\n### Countries\nKelder ships to five countries:\n- **NL**: Netherlands\n- **BE**: Belgium\n- **DE**: Germany\n- **LU**: Luxembourg\n- **FR**: France\n\n### Reporting Regions\nCountries are grouped into three reporting regions in `dim_customers.region`:\n- **Benelux**: Netherlands, Belgium, Luxembourg\n- **DACH**: Germany (Deutschland, Austria, Switzerland - but Kelder only ships to DE)\n- **Other EU**: France\n\n### Carriers\n- **PostNL**: Netherlands\n- **DHL**: All other countries (BE, DE, LU, FR)\n\n### Data Sources\n- `dim_customers.country_code`: ISO 3166-1 alpha-2 code\n- `dim_customers.country_name`: Country name\n- `dim_customers.region`: Reporting region\n- `fct_orders.carrier`: PostNL or DHL\n- `seeds/countries.csv`: Reference data for countries, regions, and carriers\n\n### Source\nSee `stg_shopify__customers` and the `countries` seed for the country and region logic.", "hash": "1f8082ed66"}, {"key": "shopify-order-source-types", "path": "global/shopify-order-source-types.md", "title": "shopify-order-source-types", "summary": "Shopify orders have three source types: web, subscription_contract, and recharge", "tags": ["orders", "subscriptions"], "sl_refs": ["fct_orders"], "usage": "auto", "body": "## Shopify Order Source Types\n\n### Source Name Values\n`fct_orders.source_name` has three values:\n\n#### `web`\nWeb checkout orders placed by customers on the Kelder website. These have:\n- Marketing channel attribution (`channel` field)\n- UTM parameters and referrer tracking\n- May be the first order that starts a subscription (`is_subscription_first_order = true`)\n\n#### `subscription_contract`\nSubscription renewal orders created by the **Shopify subscription app** billing system. These have:\n- Empty `channel` (no marketing attribution)\n- `is_subscription_renewal = true`\n- Created by scheduled subscription charges\n\n#### `recharge`\nSubscription renewal orders created by the **Recharge** billing system. These have:\n- Empty `channel` (no marketing attribution)\n- `is_subscription_renewal = true`\n- Created by Recharge charges after the migration\n\n### Usage\n- Filter for web orders: `source_name = 'web'`\n- Filter for renewals: `is_subscription_renewal = true` (includes both subscription_contract and recharge)\n- Marketing analysis: Use `channel` field (only populated for web orders)\n\n### Source\nSee `stg_shopify__orders` and `fct_orders` for the source_name logic.", "hash": "305946b0aa"}, {"key": "subscription-billing-retry-schedule", "path": "global/subscription-billing-retry-schedule.md", "title": "subscription-billing-retry-schedule", "summary": "Failed subscription payments are retried on days 1, 3, 7, 14, 21, 28; billing gives up on day 30", "tags": ["subscriptions", "billing"], "sl_refs": ["fct_subscription_events"], "usage": "auto", "body": "## Subscription Billing Retry Schedule\n\n### Billing Time\nSubscription billing runs at **05:00 Amsterdam time** on the scheduled billing date.\n\n### Retry Schedule\nWhen a payment fails, the system retries on:\n- Day 1 (first attempt)\n- Day 3\n- Day 7\n- Day 14\n- Day 21\n- Day 28\n\n### Cancellation\nIf all retries fail, billing **gives up on day 30** and cancels the subscription with `cancellation_reason = 'max_retries_reached'`.\n\n### Payment Recovery\nA payment is considered **recovered** if any retry succeeds within 30 days of the first failure.\n\nIn churn metrics v2 (from May 2026), failed payments that do not recover within 30 days are counted as churn.\n\n### Data Model\n- `int_payment_episodes`: One row per billing cycle with a failed payment, with first failure and recovery timestamps\n- `fct_subscription_events`: `payment_failed` and `payment_recovered` events\n- `int_charges_unified`: All billing attempts from Shopify and Recharge\n\n### Source\nSee `int_payment_episodes` and `int_charges_unified` models for the retry logic.", "hash": "f516560edc"}, {"key": "subscription-key", "path": "global/subscription-key.md", "title": "subscription-key", "summary": "Subscription key is a stable identifier that follows a subscription across Shopify and Recharge systems", "tags": ["subscriptions", "data-modeling"], "sl_refs": ["fct_subscriptions", "fct_subscription_events"], "usage": "auto", "body": "## Subscription Key\n\n### Purpose\nThe **subscription key** is a stable identifier that follows a subscription for its entire lifecycle, even when it moves between Shopify and Recharge systems.\n\n### Format\n- **Shopify contracts**: `shp-<contract_id>`\n- **Recharge subscriptions**: `rch-<recharge_subscription_id>` (when no Shopify contract exists)\n- **Recharge continuations**: Use the Shopify contract's key when `external_contract_id` is set\n\n### Lifecycle\nA subscription keeps its key for its whole life:\n1. Starts in Shopify → gets `shp-<contract_id>` key\n2. Migrates to Recharge → keeps the same `shp-<contract_id>` key (via `external_contract_id`)\n3. New Recharge subscription (no Shopify history) → gets `rch-<subscription_id>` key\n\n### Usage\n- `fct_subscriptions.subscription_key`: Primary key for subscriptions\n- `fct_subscription_events.subscription_key`: Links events to subscriptions\n- `int_charges_unified.subscription_key`: Links billing attempts to subscriptions\n\n### Legacy Pause Restores\nWhen operations manually re-created a subscription after the 2026-03-12 migration, the restore:\n- Gets a new `rch-<id>` key\n- Has `continues_subscription_key` pointing to the original subscription's key\n- Has `is_legacy_pause_restore = true`\n\nSee migration-artifacts-2026-03-12 for details.\n\n### Source\nDefined in `int_subscriptions_unified` and used throughout the marts layer.", "hash": "961c7e1271"}, {"key": "subscription-status-unified", "path": "global/subscription-status-unified.md", "title": "subscription-status-unified", "summary": "Subscription status is unified from Shopify and Recharge source systems into a single status field", "tags": ["subscriptions"], "sl_refs": ["fct_subscriptions", "fct_subscription_events"], "usage": "auto", "body": "## Unified Subscription Status\n\n### Source Systems\nKelder subscriptions come from two systems:\n- **Shopify subscription app**: Uses statuses `ACTIVE`, `PAUSED`, `CANCELLED`, `FAILED`, `EXPIRED`\n- **Recharge**: Uses statuses `active`, `cancelled`, `expired` (no explicit paused status; paused subscriptions are `active` with `paused_until` set)\n\n### Unified Status\n`fct_subscriptions.status` unifies these into four values:\n- `active`: Subscription is active\n- `paused`: Subscription is paused (Shopify `PAUSED` or Recharge `active` with `paused_until`)\n- `cancelled`: Subscription was cancelled (Shopify `CANCELLED` or `FAILED`, Recharge `cancelled`)\n- `expired`: Subscription expired (both systems)\n\n### Important Notes\n- **Current status only**: `fct_subscriptions.status` shows the current state. For status at a point in time, use `fct_subscription_events`.\n- **Unified in one place**: The unification happens in `int_subscriptions_unified` and nowhere else.\n- **Migration artifacts**: See the migration-artifacts-2026-03-12 page for subscriptions incorrectly marked as cancelled.\n\n### Source\nSee `int_subscriptions_unified` model for the unification logic.", "hash": "e439138a7d"}], "sl": [{"name": "dim_customers", "kind": "model", "description": "", "columns": [{"name": "customer_id", "description": "Shopify customer id.", "tests": ["not_null", "unique"]}, {"name": "email", "description": "Email address.", "tests": []}, {"name": "first_name", "description": "First name.", "tests": []}, {"name": "last_name", "description": "Last name.", "tests": []}, {"name": "country_code", "description": "Country code.", "tests": []}, {"name": "country_name", "description": "Country name.", "tests": []}, {"name": "region", "description": "Reporting region (Benelux, DACH, Other EU).", "tests": []}, {"name": "created_at", "description": "When the customer record was created.", "tests": []}, {"name": "accepts_marketing", "description": "Marketing consent.", "tests": []}, {"name": "first_order_at", "description": "First web order.", "tests": []}, {"name": "first_order_channel", "description": "Channel of the first web order.", "tests": []}, {"name": "web_orders", "description": "Number of web orders (excludes subscription renewals).", "tests": []}, {"name": "subscriptions", "description": "Number of subscriptions the customer has had.", "tests": []}, {"name": "is_active_subscriber", "description": "Has an active or paused non-gift subscription now.", "tests": []}], "measures": [{"name": "total_customers", "expr": "count(distinct customer_id)", "description": "Total unique customers.", "segments": []}, {"name": "active_subscribers", "expr": "count(distinct case when is_active_subscriber then customer_id end)", "description": "Customers with an active or paused non-gift subscription.", "segments": []}, {"name": "customers_with_marketing_consent", "expr": "count(distinct case when accepts_marketing then customer_id end)", "description": "Customers who gave marketing consent.", "segments": []}], "segments": [], "yaml": "name: dim_customers\ncolumn_overrides:\n  - name: customer_id\n    descriptions:\n      user: Shopify customer id.\n    constraints:\n      dbt:\n        not_null: true\n        unique: true\n  - name: email\n    descriptions:\n      user: Email address.\n  - name: first_name\n    descriptions:\n      user: First name.\n  - name: last_name\n    descriptions:\n      user: Last name.\n  - name: country_code\n    descriptions:\n      user: Country code.\n  - name: country_name\n    descriptions:\n      user: Country name.\n  - name: region\n    descriptions:\n      user: Reporting region (Benelux, DACH, Other EU).\n  - name: created_at\n    descriptions:\n      user: When the customer record was created.\n  - name: accepts_marketing\n    descriptions:\n      user: Marketing consent.\n  - name: first_order_at\n    descriptions:\n      user: First web order.\n  - name: first_order_channel\n    descriptions:\n      user: Channel of the first web order.\n  - name: web_orders\n    descriptions:\n      user: Number of web orders (excludes subscription renewals).\n  - name: subscriptions\n    descriptions:\n      user: Number of subscriptions the customer has had.\n  - name: is_active_subscriber\n    descriptions:\n      user: Has an active or paused non-gift subscription now.\nmeasures:\n  - name: total_customers\n    expr: count(distinct customer_id)\n    description: Total unique customers.\n  - name: active_subscribers\n    expr: count(distinct case when is_active_subscriber then customer_id end)\n    description: Customers with an active or paused non-gift subscription.\n  - name: customers_with_marketing_consent\n    expr: count(distinct case when accepts_marketing then customer_id end)\n    description: Customers who gave marketing consent.\ndescriptions:\n  ktx: Semantic-layer overlay for dim_customers.\n", "hash": "296b92caf0"}, {"name": "fct_orders", "kind": "model", "description": "", "columns": [{"name": "order_id", "description": "Shopify order id.", "tests": ["not_null", "unique"]}, {"name": "order_name", "description": "Order number.", "tests": []}, {"name": "customer_id", "description": "Customer.", "tests": []}, {"name": "created_at", "description": "When the order was placed (UTC).", "tests": []}, {"name": "order_date", "description": "Local date of the order.", "tests": []}, {"name": "source_name", "description": "web, subscription_contract or recharge.", "tests": []}, {"name": "channel", "description": "Marketing channel of web orders. Empty for renewals.", "tests": []}, {"name": "is_subscription_order", "description": "Subscription checkout or renewal.", "tests": []}, {"name": "is_subscription_first_order", "description": "The checkout that started a subscription.", "tests": []}, {"name": "is_subscription_renewal", "description": "Created by a scheduled subscription charge.", "tests": []}, {"name": "is_gift", "description": "Gift subscription purchase or shipment, or a Christmas gift box.", "tests": []}, {"name": "contains_bundle", "description": "Contains the Vaderdag Bundel.", "tests": []}, {"name": "items", "description": "Units on the order.", "tests": []}, {"name": "subtotal_price_eur", "description": "Line totals after discounts, including VAT.", "tests": []}, {"name": "total_discounts_eur", "description": "Discounts.", "tests": []}, {"name": "total_tax_eur", "description": "VAT included.", "tests": []}, {"name": "total_price_eur", "description": "Amount charged, including shipping.", "tests": []}, {"name": "is_refunded", "description": "Any refund against the order.", "tests": []}, {"name": "refunded_eur", "description": "Total refunded.", "tests": []}, {"name": "first_refunded_at", "description": "First refund.", "tests": []}, {"name": "carrier", "description": "PostNL or DHL.", "tests": []}, {"name": "shipped_at", "description": "Handed to the carrier.", "tests": []}, {"name": "delivered_at", "description": "Delivered.", "tests": []}, {"name": "has_failed_delivery", "description": "Carrier never delivered.", "tests": []}, {"name": "delivery_days", "description": "Local calendar days from shipping to delivery. PostNL strike 18-24 May 2026: Dutch parcels took 3-7 days, ~1% never delivered, late-delivery refunds rose to ~6%.", "tests": []}], "measures": [{"name": "total_orders", "expr": "count(distinct order_id)", "description": "Total orders.", "segments": []}, {"name": "web_orders_count", "expr": "count(distinct order_id)", "description": "Web checkout orders.", "segments": ["web_orders"]}, {"name": "subscription_renewal_orders", "expr": "count(distinct order_id)", "description": "Subscription renewal orders.", "segments": ["subscription_renewals"]}, {"name": "total_revenue", "expr": "sum(total_price_eur)", "description": "Total revenue including VAT and shipping.", "segments": []}, {"name": "web_revenue", "expr": "sum(total_price_eur)", "description": "Revenue from web orders.", "segments": ["web_orders"]}, {"name": "subscription_revenue", "expr": "sum(total_price_eur)", "description": "Revenue from subscription renewals.", "segments": ["subscription_renewals"]}, {"name": "total_refunded", "expr": "sum(refunded_eur)", "description": "Total refunded amount.", "segments": []}, {"name": "refund_rate", "expr": "sum(refunded_eur) / nullif(sum(total_price_eur), 0)", "description": "Refunded amount / gross revenue.", "segments": []}, {"name": "avg_order_value", "expr": "avg(total_price_eur)", "description": "Average order value.", "segments": []}, {"name": "total_items", "expr": "sum(items)", "description": "Total units sold.", "segments": []}, {"name": "orders_with_failed_delivery", "expr": "count(distinct case when has_failed_delivery then order_id end)", "description": "Orders where carrier never delivered.", "segments": []}], "segments": [{"name": "web_orders", "expr": "source_name = 'web'", "description": "Web checkout orders, excluding subscription renewals."}, {"name": "subscription_renewals", "expr": "is_subscription_renewal = true", "description": "Orders created by scheduled subscription charges."}, {"name": "paid_orders", "expr": "is_refunded = false", "description": "Orders without refunds."}, {"name": "refunded_orders", "expr": "is_refunded = true", "description": "Orders with any refund."}], "yaml": "name: fct_orders\ncolumn_overrides:\n  - name: order_id\n    descriptions:\n      user: Shopify order id.\n    constraints:\n      dbt:\n        not_null: true\n        unique: true\n  - name: order_name\n    descriptions:\n      user: Order number.\n  - name: customer_id\n    descriptions:\n      user: Customer.\n  - name: created_at\n    descriptions:\n      user: When the order was placed (UTC).\n  - name: order_date\n    descriptions:\n      user: Local date of the order.\n  - name: source_name\n    descriptions:\n      user: web, subscription_contract or recharge.\n  - name: channel\n    descriptions:\n      user: Marketing channel of web orders. Empty for renewals.\n  - name: is_subscription_order\n    descriptions:\n      user: Subscription checkout or renewal.\n  - name: is_subscription_first_order\n    descriptions:\n      user: The checkout that started a subscription.\n  - name: is_subscription_renewal\n    descriptions:\n      user: Created by a scheduled subscription charge.\n  - name: is_gift\n    descriptions:\n      user: Gift subscription purchase or shipment, or a Christmas gift box.\n  - name: contains_bundle\n    descriptions:\n      user: Contains the Vaderdag Bundel.\n  - name: items\n    descriptions:\n      user: Units on the order.\n  - name: subtotal_price_eur\n    descriptions:\n      user: Line totals after discounts, including VAT.\n  - name: total_discounts_eur\n    descriptions:\n      user: Discounts.\n  - name: total_tax_eur\n    descriptions:\n      user: VAT included.\n  - name: total_price_eur\n    descriptions:\n      user: Amount charged, including shipping.\n  - name: is_refunded\n    descriptions:\n      user: Any refund against the order.\n  - name: refunded_eur\n    descriptions:\n      user: Total refunded.\n  - name: first_refunded_at\n    descriptions:\n      user: First refund.\n  - name: carrier\n    descriptions:\n      user: PostNL or DHL.\n  - name: shipped_at\n    descriptions:\n      user: Handed to the carrier.\n  - name: delivered_at\n    descriptions:\n      user: Delivered.\n  - name: has_failed_delivery\n    descriptions:\n      user: Carrier never delivered.\n  - name: delivery_days\n    descriptions:\n      user: \"Local calendar days from shipping to delivery. PostNL strike 18-24 May 2026: Dutch parcels took 3-7 days, ~1% never delivered, late-delivery refunds rose to ~6%.\"\nmeasures:\n  - name: total_orders\n    expr: count(distinct order_id)\n    description: Total orders.\n  - name: web_orders_count\n    expr: count(distinct order_id)\n    segments:\n      - web_orders\n    description: Web checkout orders.\n  - name: subscription_renewal_orders\n    expr: count(distinct order_id)\n    segments:\n      - subscription_renewals\n    description: Subscription renewal orders.\n  - name: total_revenue\n    expr: sum(total_price_eur)\n    description: Total revenue including VAT and shipping.\n  - name: web_revenue\n    expr: sum(total_price_eur)\n    segments:\n      - web_orders\n    description: Revenue from web orders.\n  - name: subscription_revenue\n    expr: sum(total_price_eur)\n    segments:\n      - subscription_renewals\n    description: Revenue from subscription renewals.\n  - name: total_refunded\n    expr: sum(refunded_eur)\n    description: Total refunded amount.\n  - name: refund_rate\n    expr: sum(refunded_eur) / nullif(sum(total_price_eur), 0)\n    description: Refunded amount / gross revenue.\n  - name: avg_order_value\n    expr: avg(total_price_eur)\n    description: Average order value.\n  - name: total_items\n    expr: sum(items)\n    description: Total units sold.\n  -
