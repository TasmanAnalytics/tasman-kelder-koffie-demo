es initiated by subscribers during this specific month."}, {"name": "pause_rate", "type": "number", "description": "Proportion of base subscribers who initiated a pause, calculated as pauses started divided by base."}, {"name": "paused_share", "type": "number", "description": "Percentage of total subscriber base in paused status at month start relative to base subscribers."}]}, "metrics_subscriber_churn_monthly": {"table": "metrics_subscriber_churn_monthly", "columns": [{"name": "month", "type": "time", "description": "Calendar month for which churn metrics are calculated and reported."}, {"name": "definition_version_as_reported", "type": "string", "description": "Churn calculation methodology version used when metrics were originally reported."}, {"name": "base_subscribers", "type": "number", "description": "Total active subscribers at month start eligible for churn measurement."}, {"name": "churned_subscribers", "type": "number", "description": "Count of subscribers who cancelled or left during the month."}, {"name": "churn_rate_as_reported", "type": "number", "description": "Percentage of base subscribers who churned using reported definition version."}, {"name": "base_subscribers_raw", "type": "number", "description": "Unprocessed base subscriber count before any adjustments or corrections applied."}, {"name": "churned_subscribers_raw", "type": "number", "description": "Unprocessed churned subscriber count before any adjustments or corrections applied."}, {"name": "churn_rate_as_reported_raw", "type": "number", "description": "Unprocessed churn percentage before any adjustments or corrections applied."}, {"name": "churned_subscribers_v1", "type": "number", "description": "Churned subscriber count calculated using version 1 methodology."}, {"name": "churn_rate_v1", "type": "number", "description": "Churn percentage calculated using version 1 methodology."}, {"name": "base_subscribers_v2_restated", "type": "number", "description": "Base subscriber count recalculated using version 2 methodology for historical comparison."}, {"name": "churned_subscribers_v2_restated", "type": "number", "description": "Churned subscriber count recalculated using version 2 methodology for historical comparison."}, {"name": "churn_rate_v2_restated", "type": "number", "description": "Churn percentage recalculated using version 2 methodology for historical comparison."}, {"name": "is_provisional", "type": "boolean", "description": "Indicates whether metrics are preliminary and subject to revision."}]}}}, {"key": "rot", "label": "Rot", "blurb": "One commit on top of with-context. The docs and the code have drifted apart.", "ingest": {"ktx_version": "@kaelio/ktx 0.16.0", "started": "2026-09-24T16:29:10", "finished": "2026-09-24T16:36:46", "enrichment": "llm", "embeddings": "sentence-transformers all-MiniLM-L6-v2 (384)"}, "wiki": [{"key": "0001-currency-eur-including-vat", "path": "global/0001-currency-eur-including-vat.md", "title": "0001: Report money in EUR, including VAT", "summary": "Establishes that all financial reporting must be in EUR with VAT included, reflecting shop prices as displayed, with finance handling net conversions as needed.", "tags": ["financial reporting", "currency", "VAT", "revenue", "pricing"], "sl_refs": [], "usage": "auto", "body": "# 0001: Report money in EUR, including VAT\n\nDate: 2025-01-09 · Status: accepted · Owner: Sanne (data)\n\nAll sales are in EUR and shop prices include VAT (9% coffee, 21% equipment). Revenue, MRR and order\nvalues are reported including VAT, as the shop shows them. Finance converts to net where needed.", "hash": "69ce6eda4e"}, {"key": "0002-one-subscription-key", "path": "global/0002-one-subscription-key.md", "title": "0002: One subscription key, status unified in one model", "summary": "Establishes that subscriptions maintain a single key throughout their lifecycle, with billing system statuses unified into four states (active, paused, cancelled, expired) in the int_subscriptions_unified model, serving as the authoritative status source for all downstream models.", "tags": ["subscriptions", "status mapping", "billing systems", "data modeling", "unified state"], "sl_refs": ["int_subscriptions_unified"], "usage": "auto", "body": "# 0002: One subscription key, status unified in one model\n\nDate: 2025-01-16 · Status: accepted · Owner: Sanne (data)\n\nA subscription keeps one key for its whole life. Statuses from the billing systems are mapped to\nactive, paused, cancelled and expired in `int_subscriptions_unified` and nowhere else. Every other\nmodel reads the unified status or the event stream.", "hash": "c3d69d6cdc"}, {"key": "0003-pause-is-not-churn", "path": "global/0003-pause-is-not-churn.md", "title": "0003: A pause is not churn", "summary": "Defines that paused subscriptions are not counted as churn and remain in the subscriber base; churn is only recorded when a subscriber cancels after a pause.", "tags": ["subscriptions", "churn", "pause", "retention", "metrics"], "sl_refs": [], "usage": "auto", "body": "# 0003: A pause is not churn\n\nDate: 2025-02-11 · Status: accepted · Owner: Sanne (data)\n\nPaused subscriptions stay in the base and never count as churned. A subscriber who cancels after a\npause churns in the month of the cancellation.", "hash": "9ec1f1cb09"}, {"key": "0004-email-attribution-window", "path": "global/0004-email-attribution-window.md", "title": "0004: Email attribution window is five days after a click", "summary": "Defines the email attribution window as five days following a click event from the same Klaviyo profile, computed directly from Klaviyo events rather than using Klaviyo's attributed_message_id field.", "tags": ["email attribution", "Klaviyo", "click events", "attribution window", "data definition"], "sl_refs": ["Klaviyo"], "usage": "auto", "body": "# 0004: Email attribution window is five days after a click\n\nDate: 2025-03-04 · Status: accepted · Owner: Sanne (data), agreed with Joris (retention)\n\nAn order is email-attributed if the same Klaviyo profile clicked an email in the five days before\nit. Opens do not count. We compute this ourselves from Klaviyo events rather than using Klaviyo's\nattributed_message_id, so the rule is visible in SQL.", "hash": "317ce3f842"}, {"key": "0005-channel-grouping", "path": "global/0005-channel-grouping.md", "title": "0005: Channel grouping from the first order", "summary": "Defines channel grouping taxonomy (paid_social, paid_search, email, organic, referral, direct) derived from UTM parameters and referrer data, with subscriber acquisition channel determined by the checkout order that initiated the subscription.", "tags": ["channel attribution", "UTM parameters", "acquisition channel", "subscriber lifecycle"], "sl_refs": [], "usage": "auto", "body": "# 0005: Channel grouping from the first order\n\nDate: 2025-06-02 · Status: accepted · Owner: Sanne (data)\n\nChannels are paid_social, paid_search, email, organic, referral and direct, from UTM parameters on\nthe landing site first and the referrer second. A subscriber's acquisition channel is the channel of\nthe checkout order that started the subscription.", "hash": "b943475f5e"}, {"key": "0006-gift-subscriptions-zero-mrr", "path": "global/0006-gift-subscriptions-zero-mrr.md", "title": "0006: Gift subscriptions carry zero MRR and sit outside the churn base", "summary": "Defines that gift subscriptions are prepaid for three shipments with zero MRR and are excluded from churn calculations and the churn base.", "tags": ["gift subscriptions", "MRR", "churn", "revenue recognition", "prepaid"], "sl_refs": [], "usage": "auto", "body": "# 0006: Gift subscriptions carry zero MRR and sit outside the churn base\n\nDate: 2025-11-18 · Status: accepted · Owner: Sanne (data), agreed with Femke (finance)\n\nGift subscriptions are prepaid for three shipments and then expire. The purchase is revenue once, at\ncheckout. Their MRR is zero by design, and they are excluded from the churn base and from churn.", "hash": "e4358ca4b1"}, {"key": "0007-recharge-migration-churn-artifacts", "path": "global/0007-recharge-migration-churn-artifacts.md", "title": "0007: Recharge migration wrote false churn events", "summary": "Documents a data quality issue where a Recharge subscription migration on March 12 incorrectly wrote false churn events for ~1,900 paused subscriptions, with the decision to flag affected rows and report both raw and adjusted churn metrics for March 2026.", "tags": ["data quality", "migration", "churn metrics", "Recharge", "billing"], "sl_refs": ["Recharge"], "usage": "auto", "body": "# 0007: Recharge migration wrote false churn events\n\nDate: 2026-03-14 · Status: accepted · Owner: Sanne (data)\n\n## Context\n\nThe 12 March billing migration backfilled Recharge subscription\nstatuses. Recharge has no \"paused\" state in the legacy import path,\nso ~1,900 paused subscriptions arrived as \"cancelled\", writing\nchurned_at timestamps that never happened.\n\n## Decision\n\nFlag affected rows with is_migration_artifact = true. Exclude\nflagged rows from churn metrics. Report both raw and adjusted\nchurn for March 2026 in any board-facing number.\n\n## Rejected alternative\n\nDeleting the rows. Finance reconciles against Recharge exports,\nso the raw record must match source.\n\n## Consequences\n\nMarch raw churn (9.4%) and adjusted churn (3.3%) will both exist.\nAnyone quoting March churn without the adjustment is wrong.", "hash": "8e3c03440d"}, {"key": "0008-restores-are-continuations", "path": "global/0008-restores-are-continuations.md", "title": "0008: Legacy pause restores are continuations", "summary": "Defines how legacy pause subscriptions wiped during the 12 March migration are restored as new Recharge subscriptions marked with restore_source = legacy_pause, maintaining original subscription identity and tenure rather than being treated as new acquisitions.", "tags": ["subscription management", "migration", "pause restores", "Recharge", "legacy data"], "sl_refs": ["Recharge subscriptions"], "usage": "auto", "body": "# 0008: Legacy pause restores are continuations\n\nDate: 2026-03-17 · Status: accepted · Owner: Sanne (data)\n\nOperations re-creates subscriptions whose pause the 12 March migration wiped (decision 0007) as new\nRecharge subscriptions, marked `restore_source = legacy_pause`. A restore continues the original\nsubscription: same key, same tenure. It is not a new subscriber and not acquisition. See\n`quirks/legacy_pause_restores.md`.", "hash": "bb018e7d33"}, {"key": "0009-churn-v2-dunning-grace", "path": "global/0009-churn-v2-dunning-grace.md", "title": "0009: Churn v2, 30-day dunning grace", "summary": "Defines Churn v2 methodology effective May 1, 2026, which counts failed payments as churn only if unrecovered within 30 days, replacing v1 which counted failures immediately, with parallel as-reported and restated historical series for comparison.", "tags": ["churn", "dunning", "payment recovery", "metrics definition", "financial reporting"], "sl_refs": [], "usage": "auto", "body": "# 0009: Churn v2, 30-day dunning grace\n\nDate: 2026-04-28 · Status: accepted · Owner: Sanne (data), agreed with Femke (finance)\n\n## Context\n\nUnder v1 a failed payment counts as churn on the day it fails.\nRecharge dunning retries recover a material share of failed\npayments within 30 days, so v1 overstated losses.\n\n## Decision\n\nFrom 1 May 2026, a failed payment counts as churn only if it is\nnot recovered within 30 days, attributed to the month of the\nfirst failure. The as-reported series keeps v1 for months before\nMay. A restated v2 series covers all months for like-for-like\ncomparisons.\n\n## Rejected alternative\n\nSilently restating all history under v2, because board decks had\nalready quoted v1 figures.\n\n## Consequences\n\n- Churn falls on 1 May for definitional reasons, by roughly half a\n  percentage point on Q1 2026 recoveries.\n- Comparisons across 1 May must use the restated series.\n- The most recent month is provisional under v2 until 30 days have\n  passed, and will be revised upward.", "hash": "e090da03a9"}, {"key": "churn-definition-versions", "path": "global/churn-definition-versions.md", "title": "churn-definition-versions", "summary": "Churn metric definition changed on 2026-05-01: v1 vs v2 and how to compare across the change", "tags": ["subscriptions", "finance"], "sl_refs": ["metrics_subscriber_churn_monthly"], "usage": "auto", "body": "## Churn Definition Versions\n\n### Timeline\n- **v1**: Used before May 2026\n- **v2**: Used from May 2026 onward (decision 0009)\n\n### The change\nThe churn definition changed on 2026-05-01. The as-reported series (`churn_rate_as_reported`) uses v1 before May 2026 and v2 from May 2026 onward.\n\n### How to compare across the change\n- **Do NOT compare** `churn_rate_as_reported` across May 2026 - the definition changed.\n- **Use** `churn_rate_v2_restated` for like-for-like comparisons across the change. This column applies v2 to every month.\n\n### Columns in metrics_subscriber_churn_monthly\n- `definition_version_as_reported`: v1 or v2, shows which definition was used for the as-reported series in that month.\n- `churn_rate_as_reported`: The as-reported churn rate (v1 before May 2026, v2 from May).\n- `churn_rate_v1`: v1 churn for every month (restated).\n- `churn_rate_v2_restated`: v2 churn for every month (restated). **Use this for comparisons across May 2026.**\n\n### Provisional data\nThe latest month is provisional (`is_provisional = true`). v2 does not count payment failures younger than 30 days yet, so the churn rate will be revised upward as failures age.\n\n### Related\n- `metrics_subscriber_churn_monthly`\n- `context_metric_changelog` (definition details)\n- Decision 0009 (reason for change)", "hash": "53aba6eed8"}, {"key": "context-business-events", "path": "global/context-business-events.md", "title": "context-business-events", "summary": "context_business_events table: dated events that moved metrics (migrations, promos, outages, definition changes, logistics)", "tags": ["conventions", "data-quality"], "sl_refs": [], "usage": "auto", "body": "## context.business_events\n\n### Purpose\nTracks dated events that moved a metric: migrations, promotions, outages, definition changes, and logistics events.\n\n**Check this table before explaining any anomaly in a metric.**\n\n### Structure\nOne row per event with:\n- `event_date`: Date the event started (local date)\n- `event_type`: migration, promo, outage, definition_change, or logistics\n- `title`: Short title\n- `description`: What happened and what it does to the numbers\n- `affected_metrics`: Metrics the event moves (array of metric names)\n- `expected_effect`: Expected direction (up, down, gap, none) with qualifier\n- `owner`: Person who owns the event record\n- `source_link`: Decision record, Linear ticket, Slack thread, or Notion page\n\n### Event types\n- **migration**: Data migration or system change (e.g., Recharge migration 2026-03-12)\n- **promo**: Promotional campaign or discount\n- **outage**: System outage or data gap (e.g., Klaviyo connector outage)\n- **definition_change**: Metric definition change (e.g., churn v1 → v2)\n- **logistics**: Logistics event (e.g., PostNL strike)\n\n### How to use\n1. Query `context_business_events` when investigating a metric anomaly\n2. Check `affected_metrics` to see which metrics the event impacts\n3. Follow `source_link` for full context and resolution\n4. State the caveat explicitly when reporting affected periods\n\n### Source\nLoaded from `seeds/context/business_events.csv` and rendered to `context_business_events` model.\n\n### Related\n- `context_metric_changelog` (metric definition versions)\n- Wiki pages for specific events (Recharge migration, PostNL strike, Klaviyo outage)", "hash": "fc17df5b79"}, {"key": "context-metric-changelog", "path": "global/context-metric-changelog.md", "title": "context-metric-changelog", "summary": "context_metric_changelog table: versioned metric definitions tracking when and why definitions changed", "tags": ["conventions", "finance"], "sl_refs": ["metrics_subscriber_churn_monthly"], "usage": "auto", "body": "## context.metric_changelog\n\n### Purpose\nTracks versioned metric definitions. When a metric's definition changes, a row is added here along with a decision record.\n\n### Structure\nOne row per metric version with:\n- `metric`: Metric name\n- `version`: Definition version (v1, v2, etc.)\n- `valid_from`: First month the definition applies to in the as-reported series\n- `valid_to`: Day before the next version starts (empty for current version)\n- `definition`: The definition in words\n- `reason_for_change`: Why the definition changed\n- `is_current`: True for the version in force now\n\n### Example: Churn definition\n- **v1**: Used before May 2026\n- **v2**: Used from May 2026 onward (decision 0009)\n- **Reason**: v2 counts payment failures that remain unrecovered after 30 days; v1 counted all voluntary cancellations\n\n### How to use\n1. Query `context_metric_changelog` to understand metric definition history\n2. Check `valid_from` and `valid_to` to see which version applies to a given period\n3. Use restated columns (e.g., `churn_rate_v2_restated`) for like-for-like comparisons across definition changes\n4. Follow decision records for full context\n\n### Source\nLoaded from `seeds/context/metric_changelog.csv` and rendered to `context_metric_changelog` model.\n\n### Related\n- `context_business_events` (definition_change events)\n- `metrics_subscriber_churn_monthly` (v1 vs v2 columns)\n- Wiki page: churn-definition-versions", "hash": "30d8933db8"}, {"key": "countries-and-regions", "path": "global/countries-and-regions.md", "title": "countries-and-regions", "summary": "Kelder ships to 5 countries in 3 regions: Benelux (NL, BE, LU), DACH (DE), Other EU (FR)", "tags": ["logistics"], "sl_refs": [], "usage": "auto", "body": "## Countries and Regions\n\n### Countries\nKelder ships to five countries:\n- **NL**: Netherlands\n- **BE**: Belgium\n- **LU**: Luxembourg\n- **DE**: Germany\n- **FR**: France\n\n### Reporting regions\nCountries are grouped into three reporting regions:\n- **Benelux**: Netherlands, Belgium, Luxembourg\n- **DACH**: Germany\n- **Other EU**: France\n\n### Carriers\n- **PostNL**: Netherlands\n- **DHL**: All other countries\n\n### Where used\n- `dim_customers.country_code` (ISO 3166-1 alpha-2)\n- `dim_customers.country_name`\n- `dim_customers.region`\n- `fct_orders.carrier`\n- `seeds/countries.csv` (reference data)\n\n### Validation\nCountry codes are validated with dbt `accepted_values` test.\n\n### Related\n- PostNL strike May 2026 (affected Dutch orders only)", "hash": "0e35d91d4f"}, {"key": "dbt-project-structure", "path": "global/dbt-project-structure.md", "title": "dbt-project-structure", "summary": "dbt project structure: staging (views), intermediate (tables), marts (tables), context (tables)", "tags": ["conventions"], "sl_refs": [], "usage": "auto", "body": "## dbt Project Structure\n\n### Layer structure\nThe Kelder dbt project follows a four-layer structure:\n\n#### Staging (stg_*)\n- **Schema**: `staging`\n- **Materialization**: Views\n- **Purpose**: Clean, renamed source data with minimal transformation\n- **Naming**: `stg_{source}__{entity}` (e.g., `stg_shopify__orders`, `stg_recharge__subscriptions`)\n- **Tests**: Column-level tests (not_null, unique, accepted_values, relationships)\n\n#### Intermediate (int_*)\n- **Schema**: `intermediate`\n- **Materialization**: Tables\n- **Purpose**: Business logic transformations, unifications, and derived datasets\n- **Naming**: `int_{entity}` (e.g., `int_subscriptions_unified`, `int_payment_episodes`)\n- **Key models**:\n  - `int_subscriptions_unified`: Unified subscription status across Shopify and Recharge\n  - `int_charges_unified`: Billing attempts from both systems\n  - `int_payment_episodes`: Dunning episodes with recovery tracking\n  - `int_subscription_events`: Unified event stream\n\n#### Marts (dim_*, fct_*, metrics_*)\n- **Schema**: `main`\n- **Materialization**: Tables\n- **Purpose**: Business-facing dimensional models and governed metrics\n- **Naming**:\n  - `dim_*`: Dimension tables (e.g., `dim_customers`)\n  - `fct_*`: Fact tables (e.g., `fct_orders`, `fct_subscriptions`)\n  - `metrics_*`: Pre-aggregated governed metrics (e.g., `metrics_subscriber_churn_monthly`)\n\n#### Context (context_*)\n- **Schema**: `context`\n- **Materialization**: Tables\n- **Purpose**: Metadata, business events, metric changelog\n- **Key models**:\n  - `context_business_events`: Dated events that moved metrics\n  - `context_metric_changelog`: Versioned metric definitions\n\n### Configuration\nSet in `dbt_project.yml`:\n```yaml\nmodels:\n  kelder:\n    staging:\n      +schema: staging\n      +materialized: view\n    intermediate:\n      +schema: intermediate\n      +materialized: table\n    marts:\n      +schema: main\n      +materialized: table\n    context:\n      +schema: context\n      +materialized: table\n```\n\n### Reporting date\nMetrics cover full months before the as-of date:\n```yaml\nvars:\n  as_of_date: \"2026-07-01\"\n  first_reporting_month: \"2025-01-01\"\n```\n\n### Related\n- Wiki pages for specific models and conventions\n- `context_business_events` and `context_metric_changelog` for metadata", "hash": "9c1a45dedc"}, {"key": "email-attribution-logic", "path": "global/email-attribution-logic.md", "title": "email-attribution-logic", "summary": "Email attribution uses 5-day lookback: orders attributed to email if profile clicked within 5 days before order", "tags": ["marketing"], "sl_refs": ["metrics_email_attribution_daily"], "usage": "auto", "body": "## Email Attribution Logic\n\n### Attribution window\nEmail attribution uses a **5-day lookback window**. An order is attributed to email if the same Klaviyo profile clicked an email within the 5 days before placing the order.\n\n### How it works\n1. Klaviyo tracks email engagement events per profile: Received Email, Opened Email, Clicked Email\n2. Klaviyo tracks Placed Order events with order value\n3. An order is **attributed** if the profile has a Clicked Email event in the 5 days before the order\n4. Klaviyo's own `attributed_message_id` field is also captured but not used for the 5-day attribution logic\n\n### Metrics\n- `metrics_email_attribution_daily.attributed_orders`: Orders with a click in the previous 5 days\n- `metrics_email_attribution_daily.attributed_revenue_eur`: Revenue from attributed orders\n\n### Data quality caveat\nThe Klaviyo connector outage (9-10 April 2026) created a gap in click events. Orders placed up to 5 days after the outage (through 15 April) lost the clicks that would have attributed them, so attributed revenue is understated for 9-15 April.\n\n### Related\n- `metrics_email_attribution_daily`\n- `stg_klaviyo__events` (source events)\n- Wiki page: klaviyo-outage-april-2026", "hash": "dd6103e918"}, {"key": "gift-subscriptions", "path": "global/gift-subscriptions.md", "title": "gift-subscriptions", "summary": "Gift subscriptions: prepaid 3-shipment subscriptions excluded from subscriber metrics and MRR", "tags": ["subscriptions", "finance"], "sl_refs": ["fct_subscriptions", "fct_subscription_events", "fct_orders", "metrics_subscriber_churn_monthly", "metrics_new_subscribers_monthly"], "usage": "auto", "body": "## Gift Subscriptions\n\n### Definition\nPrepaid gift subscriptions are 3-shipment subscriptions paid once at purchase. They sit outside regular subscriber metrics.\n\n### Key characteristics\n- **Prepaid**: Paid once at purchase, not recurring billing.\n- **Fixed duration**: Three shipments, then expired.\n- **Flagged**: `is_gift = true` in `fct_subscriptions`, `fct_subscription_events`, and `fct_orders`.\n- **Zero MRR**: `mrr_eur = 0` by design in `fct_subscriptions`. Gifts are not recurring revenue.\n\n### Impact on metrics\n- **Subscriber counts**: Exclude gifts from base subscribers, new subscribers, churn, and pause metrics.\n- **MRR**: Gifts contribute zero to MRR.\n- **Orders**: Gift subscription purchases and shipments are flagged with `is_gift = true` in `fct_orders`.\n- **Filter**: `WHERE is_gift = false` when analyzing subscriber behavior or recurring revenue.\n\n### Related\n- `fct_subscriptions.is_gift`\n- `fct_subscriptions.mrr_eur` (zero for gifts)\n- `fct_subscription_events.is_gift`\n- `fct_orders.is_gift`\n- `metrics_subscriber_churn_monthly` (base excludes gifts)\n- `metrics_new_subscribers_monthly` (excludes gifts)", "hash": "0de7622283"}, {"key": "gift_subscriptions", "path": "global/gift_subscriptions.md", "title": "Gift subscriptions", "summary": "Defines gift subscriptions as three-shipment prepaid products (SKU GIFT-SUB-3) that expire rather than churn, with zero MRR by design and flagged via is_gift attribute, excluding them from churn calculations and revenue recognition.", "tags": ["gift subscriptions", "prepaid", "churn exclusion", "MRR", "Shopify", "Recharge", "subscription lifecycle"], "sl_refs": ["fct_subscriptions"], "usage": "auto", "body": "# Gift subscriptions\n\nOwner: Sanne (data). Written 2026-06-15.\n\n- A gift subscription is prepaid for three shipments, four weeks apart. The buyer pays once at\n  checkout (SKU `GIFT-SUB-3`); the three shipments are zero-value renewal orders.\n- After the third shipment the subscription is `expired`, not cancelled. Expiry is not churn.\n- Gift subscriptions are excluded from the churn base and from churn, in every definition version.\n- `fct_subscriptions.mrr_eur` is zero for gifts by design (decision 0006). The revenue shows up once,\n  in the purchase order.\n- Gifts are flagged with `is_gift`: the Shopify contract custom attribute before March 2026, the\n  Recharge property from then. Recharge gifts are also `is_prepaid`.\n- Volumes: about 300 sold in December 2025 and about 450 in the Father's Day week, 14 to 21 June 2026\n  (context.business_events). Expect new customers and average order value to rise in those weeks\n  while MRR does not.", "hash": "e54622cfff"}, {"key": "glossary", "path": "global/glossary.md", "title": "Glossary", "summary": "A glossary defining key subscription and revenue metrics including base, churn (with versioned definitions), MRR, pause, gift subscriptions, restores, and email-attributed revenue, with notes on data adjustments and calculation methodologies.", "tags": ["subscription metrics", "churn", "MRR", "glossary", "definitions", "billing", "Recharge", "Klaviyo"], "sl_refs": [], "usage": "auto", "body": "# Glossary\n\nOwner: Sanne (data). Metric definitions live in `metric_changelog.md`; this page explains the terms.\n\n**Base.** Subscriptions in status active or paused at 00:00 Amsterdam time on the first day of the\nmonth. Gift subscriptions are never in the base.\n\n**Churn.** Churned in the month divided by the base. Churned means voluntary cancellations in the\nmonth plus failed payments, counted per the definition version:\n\n- **v1** (to April 2026): a subscription whose payment first failed in the month counts as churned\n  on the day of failure, whether or not a retry later recovers it.\n- **v2** (from May 2026): a failed payment counts only if it is not recovered within 30 days. It is\n  attributed to the month of the first failure. For the latest month, failures younger than 30 days\n  at the as-of date do not count yet, so the latest month is provisional and will be revised upward.\n\n**As reported versus restated.** The as-reported series is what we publish: v1 up to April 2026 and\nv2 from May 2026. The restated series is v2 for every month. Compare months across 1 May 2026 only\nwith the restated series (`churn_rate_v2_restated`), otherwise you compare two definitions.\n\n**Raw versus adjusted.** Raw counts the cancellations written by the 12 March 2026 billing migration\n(about 1,900 paused subscriptions imported as cancelled). Adjusted excludes them and treats the\naffected subscriptions as still paused until their restore. Adjusted is the real number. Raw exists\nso finance can reconcile against Recharge exports (decision 0007).\n\n**Pause.** A subscriber can pause for one, two, three or six months. A paused subscription is still\nin the base and is not churn. Recharge has no paused status: paused means `active` with\n`paused_until` set. From 28 March 2026 the cancel flow offers a pause first, so the pause rate rises.\n\n**Gift subscription.** Prepaid for three shipments, then `expired`. Outside the base and outside\nchurn. MRR is zero by design (decision 0006).\n\n**Restore.** A new Recharge subscription that operations created for a customer whose pause was wiped\nby the migration (`restore_source = legacy_pause`). A restore continues the original subscription's\nkey and tenure. It is not a new subscriber (decision 0008).\n\n**MRR.** Price per shipment, normalised to a month (x 365.25 / 12 / interval days), for active\nsubscriptions. Paused and ended subscriptions contribute zero. Gifts contribute zero.\n\n**Email-attributed revenue.** Value of Klaviyo Placed Order events where the same profile clicked an\nemail in the five days before the order (decision 0004). There is no Klaviyo data from\n2026-04-09 06:00 UTC to 2026-04-10 13:00 UTC, so 9 to 15 April 2026 are understated.\n\n**New subscribers.** Subscriptions started in the month, excluding gifts and restores.\n\n**CAC.** Paid channel ad spend in the month divided by new subscribers whose first order came through\nthat channel.", "hash": "920c36cc00"}, {"key": "klaviyo-outage-april-2026", "path": "global/klaviyo-outage-april-2026.md", "title": "klaviyo-outage-april-2026", "summary": "Klaviyo connector outage 9-10 April 2026: incomplete email attribution data through 15 April", "tags": ["marketing", "data-quality"], "sl_refs": ["metrics_email_attribution_daily"], "usage": "auto", "body": "## Klaviyo Connector Outage (9-10 April 2026)\n\n### What happened\nFivetran Klaviyo connector outage from 2026-04-09 06:00 UTC to 2026-04-10 13:00 UTC. The data was never backfilled.\n\n### Impact\n- **Email events**: No Klaviyo data for 9 and 10 April. Email engagement metrics (received, opened, clicked) are incomplete for those days.\n- **Attribution window**: Email attribution uses a 5-day lookback. Orders placed up to 5 days after the outage (through 15 April) lost the clicks that would have attributed them.\n- **Attributed revenue**: Understated from 9 to 15 April.\n- **Shopify orders**: Complete. Only Klaviyo events are missing.\n\n### Affected days\n- **9-10 April**: Email engagement metrics incomplete.\n- **9-15 April**: Email-attributed revenue understated.\n\n### How to handle\n- **Exclude 9-15 April** when analyzing email attribution trends.\n- **Or state the caveat** explicitly when including those days.\n- **Flag**: `is_incomplete = true` in `metrics_email_attribution_daily` for 9-15 April.\n\n### Related\n- `metrics_email_attribution_daily.is_incomplete`\n- `context_business_events` (event record)", "hash": "409bed928f"}, {"key": "legacy-pause-restores", "path": "global/legacy-pause-restores.md", "title": "legacy-pause-restores", "summary": "Legacy pause restores: Recharge subscriptions re-created by operations after migration wiped pauses", "tags": ["data-quality", "subscriptions"], "sl_refs": ["fct_subscriptions", "metrics_new_subscribers_monthly"], "usage": "auto", "body": "## Legacy Pause Restores\n\n### What they are\nRecharge subscriptions re-created by the operations team for customers whose pause was wiped by the 2026-03-12 migration. These subscriptions have `restore_source = 'legacy_pause'` in Recharge properties.\n\n### Key characteristics\n- **Continuations, not new subscribers**: Restores continue the original subscription's key and tenure via `continues_subscription_key`.\n- **Flagged**: `is_legacy_pause_restore = true` in `fct_subscriptions`.\n- **Original subscription key**: The restore inherits the original subscription's `subscription_key` (e.g., `shp-21400232`).\n\n### Impact on metrics\n- **New subscriber counts**: Exclude restores from new subscriber metrics. They are continuations, not acquisitions.\n- **Acquisition metrics**: Exclude restores from CAC and channel attribution. The original subscription already counted.\n- **Filter**: `WHERE is_legacy_pause_restore = false` when counting new subscriptions or analyzing acquisition.\n\n### Related\n- `fct_subscriptions.is_legacy_pause_restore`\n- `fct_subscriptions.continues_subscription_key`\n- `metrics_new_subscribers_monthly` (already excludes restores)", "hash": "9532b64cf9"}, {"key": "legacy_pause_restores", "path": "global/legacy_pause_restores.md", "title": "Legacy pause restores", "summary": "Documents the legacy pause restoration process following the 12 March billing migration, which converted paused Shopify subscriptions to cancelled Recharge subscriptions, and describes how operations re-creates these subscriptions and how they should be treated in analytics.", "tags": ["billing migration", "pause restoration", "Recharge subscriptions", "data lineage", "subscription events"], "sl_refs": ["fct_subscriptions", "int_subscription_events_adjusted", "metrics_new_subscribers_monthly", "metrics_cac_monthly"], "usage": "auto", "body": "# Legacy pause restores\n\nOwner: Sanne (data). Written 2026-03-17.\n\n## What happened\n\nThe 12 March billing migration wiped every pause: subscriptions that were paused at the last\nShopify sync arrived in Recharge as cancelled (decision 0007). Those customers still expected\ncoffee when their pause ended.\n\nFrom 16 March an operations job re-creates each affected subscription on the original\n`pause_until` date, as a new Recharge subscription:\n\n- same customer, plan and product;\n- status `active`, `created_at` at the job's run time, 09:15 Amsterdam time on weekdays;\n- `properties` contains `{\"restore_source\": \"legacy_pause\", \"legacy_contract_id\": \"<Shopify contract id>\"}`;\n- first charge at the next 05:00 billing run.\n\nSubscriptions whose pause ends after the end of the data are not restored yet.\n\n## How to treat them\n\n- A restore is a continuation, not a new subscriber. `fct_subscriptions.is_legacy_pause_restore`\n  flags it and `continues_subscription_key` points at the original subscription.\n- The adjusted event stream (`int_subscription_events_adjusted`) moves the restore's events to the\n  original key. The original subscription counts as paused from its Shopify pause until the\n  restore is created.\n- `metrics_new_subscribers_monthly` and `metrics_cac_monthly` exclude restores.\n- A naive count of Recharge subscriptions created in March to June counts restores as new\n  subscribers. That overstates acquisition by roughly 1,600 subscriptions.", "hash": "5010c4d16d"}, {"key": "marketing-channel-attribution", "path": "global/marketing-channel-attribution.md", "title": "marketing-channel-attribution", "summary": "Marketing channel attribution: how web orders are attributed to paid_social, paid_search, email, organic, referral, or direct", "tags": ["marketing"], "sl_refs": ["fct_orders", "dim_customers", "fct_subscriptions", "metrics_cac_monthly"], "usage": "auto", "body": "## Marketing Channel Attribution\n\n### Channels\nWeb orders are attributed to one of six channels:\n- **paid_social**: Paid social media (Meta Ads - Facebook and Instagram)\n- **paid_search**: Paid search (Google Ads)\n- **email**: Email marketing (Klaviyo)\n- **organic**: Organic search\n- **referral**: Referral traffic\n- **direct**: Direct traffic\n\n### Attribution logic\nChannel is derived from UTM parameters and referrer on the landing site of the visit that led to the order:\n- `utm_source` and `utm_medium` determine paid channels\n- Referrer determines organic, referral, or direct\n\n### Subscription renewals\nSubscription renewal orders have **no channel** (`channel` is empty). They are created by the billing system, not by a customer visit.\n\n### Related columns\n- `fct_orders.channel`\n- \n- \n- \n- \n- `fct_orders.is_subscription_renewal` (no channel for renewals)\n\n### Related\n- `fct_orders`\n- `dim_customers.first_order_channel`\n- `fct_subscriptions.first_order_channel`\n- `metrics_cac_monthly` (CAC by channel)", "hash": "595a668c0c"}, {"key": "metric_changelog", "path": "global/metric_changelog.md", "title": "Metric changelog", "summary": "A changelog documenting the evolution of the subscriber_churn_rate metric, tracking definition changes and their effective dates from January 2025 onwards, including adjustments to how failed payments are counted in churn calculations.", "tags": ["metric", "churn", "changelog", "subscriber", "definition", "versioning"], "sl_refs": ["subscriber_churn_rate"], "usage": "auto", "body": "# Metric changelog\n\nGenerated from `seeds/context/metric_changelog.csv` by `scripts/render_metric_changelog.py`.\nDo not edit by hand. The same rows are in the warehouse as `context.metric_changelog`.\n\n## subscriber_churn_rate\n\n| Version | Valid from | Definition | Reason for change |\n|---|---|---|---|\n| v1 | 2025-01-01 | Cancelled in month / active at month start. Failed payments count as churn on day one | Initial definition |\n| v2 | 2026-05-01 | As v1, with a 30-day dunning grace before a failed payment counts as churn | Recharge dunning recovers a material share of failed payments; day-one counting overstated losses |", "hash": "0bb629f32e"}, {"key": "postnl-strike-may-2026", "path": "global/postnl-strike-may-2026.md", "title": "postnl-strike-may-2026", "summary": "PostNL strike 18-24 May 2026: delivery delays and increased refund rates for Dutch orders", "tags": ["logistics", "data-quality"], "sl_refs": ["fct_orders"], "usage": "auto", "body": "## PostNL Strike (18-24 May 2026)\n\n### What happened\nPostNL strike from 18 to 24 May 2026 caused delivery delays and failures for Dutch orders shipped during that week.\n\n### Impact\n- **Delivery times**: Dutch PostNL parcels shipped in that week took 3 to 7 days (vs normal 1-2 days).\n- **Failed deliveries**: About 1% of parcels were never delivered.\n- **Refunds**: Late-delivery refunds rose to about 6% of orders shipped that week (vs normal ~1%).\n\n### How to handle\n- **Exclude the week** when comparing delivery times or refund rates across periods.\n- **Or state the caveat** explicitly when including the week in analysis.\n- **Filter**: `WHERE shipped_at NOT BETWEEN '2026-05-18' AND '2026-05-24'` to exclude the strike week.\n\n### Affected columns\n- `fct_orders.delivery_days` (inflated for Dutch PostNL orders shipped 18-24 May)\n- `fct_orders.has_failed_delivery` (elevated for that week)\n- `fct_orders.refunded_eur` (elevated for late-delivery refunds)\n\n### Related\n- `fct_orders.delivery_days` (caveat in column description)\n- `context_business_events` (event record)", "hash": "b72ab96f28"}, {"key": "product-types", "path": "global/product-types.md", "title": "product-types", "summary": "Kelder product types: single_origin, blend, decaf, equipment, gift_box, gift_subscription, bundle", "tags": ["products"], "sl_refs": [], "usage": "auto", "body": "## Kelder Product Types\n\n### Product type taxonomy\nKelder products are categorized into seven types:\n- **single_origin**: Single-origin coffee\n- **blend**: Coffee blends\n- **decaf**: Decaffeinated coffee\n- **equipment**: Coffee equipment (grinders, filters, etc.)\n- **gift_box**: Gift boxes (e.g., Christmas gift boxes)\n- **gift_subscription**: Prepaid gift subscriptions\n- **bundle**: Product bundles (e.g., Vaderdag Bundel)\n\n### Where used\n- `stg_shopify__products.product_type`\n- `stg_shopify__product_variants.product_type`\n\n### Validation\nProduct types are validated with dbt `accepted_values` test to ensure data quality.\n\n### Related\n- `fct_orders.is_gift` (gift_box and gift_subscription orders)\n- `fct_orders.contains_bundle` (bundle orders)\n- `fct_subscriptions.is_gift` (gift_subscription subscriptions)", "hash": "a6f6940dde"}, {"key": "recharge-migration-2026-03-12", "path": "global/recharge-migration-2026-03-12.md", "title": "recharge-migration-2026-03-12", "summary": "2026-03-12 Recharge migration artifact: ~1,900 paused subscriptions incorrectly marked as cancelled", "tags": ["data-quality", "subscriptions"], "sl_refs": ["fct_subscriptions", "fct_subscription_events", "metrics_subscriber_churn_monthly"], "usage": "auto", "body": "## Recharge Migration Artifact (2026-03-12)\n\n### What happened\nThe 2026-03-12 Recharge backfill incorrectly wrote `churned_at` timestamps for approximately 1,900 subscriptions that were **paused** at the last Shopify sync. These subscriptions arrived in Recharge as **cancelled** at 2026-03-12 00:00:00 UTC with no cancellation reason.\n\n### Impact on metrics\n- **Churn metrics**: These subscriptions were not actually cancelled. They are flagged with `is_migration_artifact = true` in `fct_subscriptions` and `fct_subscription_events`.\n- **Adjusted vs raw**: The adjusted churn metrics (`churn_rate_as_reported`, `churn_rate_v2_restated`) exclude migration artifacts. The `_raw` columns include them for reconciliation with Recharge exports.\n- **Decision**: See decision 0007 for the full context and resolution.\n\n### How to handle\n- **Always use adjusted metrics** (`base_subscribers`, `churned_subscribers`, `churn_rate_as_reported`, `churn_rate_v2_restated`) for reporting.\n- Use `_raw` columns **only** for finance reconciliation against Recharge exports.\n- Filter: `WHERE is_migration_artifact = false` when querying `fct_subscriptions` or `fct_subscription_events` for churn analysis.\n\n### Related\n- `fct_subscriptions.is_migration_artifact`\n- `fct_subscription_events.is_migration_artifact`\n- `metrics_subscriber_churn_monthly` (adjusted vs raw columns)", "hash": "033992318b"}, {"key": "reporting-timezone", "path": "global/reporting-timezone.md", "title": "reporting-timezone", "summary": "Reporting timezone is Europe/Amsterdam; local dates and times for billing, events, and metrics", "tags": ["conventions"], "sl_refs": [], "usage": "auto", "body": "## Reporting Timezone\n\n### Timezone\nAll reporting uses **Europe/Amsterdam** timezone (CET/CEST).\n\n### Local dates\n- **Order dates**: `fct_orders.order_date` is the local date of the order in Amsterdam time.\n- **Billing cycle dates**: `billing_cycle_date` columns are local dates in Amsterdam time.\n- **Event months**: `event_month` columns are local calendar months in Amsterdam time.\n- **Metrics**: Monthly metrics use calendar months starting at 00:00 Amsterdam time on the first of the month.\n\n### UTC timestamps\nMost timestamp columns (`created_at`, `occurred_at`, `shipped_at`, etc.) are stored in **UTC** but should be interpreted in Amsterdam time for reporting.\n\n### Billing time\nSubscription billing runs at **05:00 Amsterdam time** on the scheduled billing date.\n\n### Configuration\nSet in `dbt_project.yml`:\n```yaml\nvars:\n  reporting_timezone: \"Europe/Amsterdam\"\n```\n\n### Related\n- `int_reporting_months` (month boundaries at 00:00 Amsterdam time)\n- All `*_at` timestamp columns (UTC)\n- All `*_date` and `*_month` columns (local Amsterdam dates)", "hash": "a086651ef5"}, {"key": "subscription-billing-schedule", "path": "global/subscription-billing-schedule.md", "title": "subscription-billing-schedule", "summary": "Subscription billing runs at 05:00 Amsterdam time; retry schedule for failed payments", "tags": ["subscriptions", "finance"], "sl_refs": ["fct_subscription_events", "fct_subscriptions"], "usage": "auto", "body": "## Subscription Billing Schedule\n\n### Billing time\nSubscription billing runs at **05:00 Amsterdam time** on the scheduled billing date.\n\n### Retry schedule for failed payments\nWhen a payment fails, the system retries on:\n- Day 1\n- Day 3\n- Day 7\n- Day 14\n- Day 21\n- Day 28\n\n### Max retries\nBilling gives up on **day 30** and cancels the subscription with `cancellation_reason = 'max_retries_reached'`.\n\n### Payment episodes\n`int_payment_episodes` tracks each billing cycle with a failed payment (dunning episode), including:\n- `first_failed_at`: First failed payment (05:00 Amsterdam time on the cycle date)\n- `recovered_at`: When a retry succeeded, if one did\n- `is_recovered_within_30_days`: Whether recovery happened within the 30-day window\n\n### Related\n- `int_payment_episodes`\n- `fct_subscription_events` (payment_failed and payment_recovered events)\n- `fct_subscriptions.cancellation_reason` (max_retries_reached)", "hash": "c332c2be90"}, {"key": "subscription-key-system", "path": "global/subscription-key-system.md", "title": "subscription-key-system", "summary": "Subscription key system: stable keys across Shopify and Recharge (shp-* and rch-*)", "tags": ["subscriptions", "conventions"], "sl_refs": ["fct_subscriptions", "fct_subscription_events"], "usage": "auto", "body": "## Subscription Key System\n\n### Purpose\nA subscription keeps its key for its whole life, even when it moves from Shopify to Recharge.\n\n### Key format\n- **shp-{contract_id}**: Shopify subscription app contracts (e.g., `shp-21400232`)\n- **rch-{subscription_id}**: Recharge subscriptions that don't carry a Shopify contract (e.g., `rch-480000197`)\n\n### Continuity across systems\nWhen a Shopify subscription continues in Recharge:\n- The Recharge subscription carries the Shopify contract id in `external_contract_id`\n- The subscription keeps the **shp-** key from Shopify\n- `fct_subscriptions.shopify_contract_id` and `recharge_subscription_id` are both populated\n\n### New Recharge subscriptions\nSubscriptions created directly in Recharge (no prior Shopify contract) get their own **rch-** key.\n\n### Where to find it\n- `fct_subscriptions.subscription_key` (primary key)\n- `fct_subscription_events.subscription_key` (foreign key)\n- `int_subscriptions_unified.subscription_key` (source of truth)\n- `int_charges_unified.subscription_key` (billing events)\n- `int_payment_episodes.subscription_key` (dunning episodes)\n\n### Related\n- `fct_subscriptions`\n- `fct_subscription_events`\n- `int_subscriptions_unified` (mapping logic)", "hash": "97cb6052cd"}, {"key": "subscription-status-unified", "path": "global/subscription-status-unified.md", "title": "subscription-status-unified", "summary": "Unified subscription status: how Shopify and Recharge statuses map to active/paused/cancelled/expired", "tags": ["subscriptions"], "sl_refs": ["fct_subscriptions", "fct_subscription_events"], "usage": "auto", "body": "## Unified Subscription Status\n\n### Source systems\nKelder subscriptions come from two systems:\n- **Shopify subscription app**: Uses statuses ACTIVE, PAUSED, CANCELLED, FAILED, EXPIRED\n- **Recharge**: Uses statuses active, cancelled, expired (no explicit paused status - paused subscriptions are 'active' with `paused_until` set)\n\n### Unified mapping\nThe `int_subscriptions_unified` intermediate model maps both systems to a single status vocabulary:\n- **active**: Subscription is billing and shipping\n- **paused**: Subscription is paused (Shopify PAUSED, or Recharge active with `paused_until` set)\n- **cancelled**: Subscription was cancelled (Shopify CANCELLED or FAILED, Recharge cancelled)\n- **expired**: Subscription expired (Shopify EXPIRED, Recharge expired)\n\n### Current status only\nThe unified status in `fct_subscriptions` is the **current** status as of the last sync. For status at a point in time, use the event stream in `fct_subscription_events`.\n\n### Related\n- `fct_subscriptions.status` (unified)\n- `int_subscriptions_unified` (mapping logic)\n- `fct_subscription_events` (status history)", "hash": "787773d699"}], "sl": [{"name": "dim_customers", "kind": "model", "description": "One row per Shopify customer, with first web order and subscription summary.", "columns": [{"name": "customer_id", "description": "Shopify customer id. dbt: unique, not null", "tests": []}, {"name": "email", "description": "Email address.", "tests": []}, {"name": "first_name", "description": "First name.", "tests": []}, {"name": "last_name", "description": "Last name.", "tests": []}, {"name": "country_code", "description": "Country code.", "tests": []}, {"name": "country_name", "description": "Country name.", "tests": []}, {"name": "region", "description": "Reporting region (Benelux, DACH, Other EU).", "tests": []}, {"name": "created_at", "description": "When the customer record was created.", "tests": []}, {"name": "accepts_marketing", "description": "Marketing consent.", "tests": []}, {"name": "first_order_at", "description": "First web order.", "tests": []}, {"name": "first_order_channel", "description": "Channel of the first web order.", "tests": []}, {"name": "web_orders", "description": "Number of web orders (excludes subscription renewals).", "tests": []}, {"name": "subscriptions", "description": "Number of subscriptions the customer has had.", "tests": []}, {"name": "is_active_subscriber", "description": "Has an active or paused non-gift subscription now.", "tests": []}], "measures": [], "segments": [], "yaml": "name: dim_customers\ndescriptions:\n  user: One row per Shopify customer, with first web order and subscription summary.\ncolumn_overrides:\n  - name: customer_id\n    descriptions:\n      user: \"Shopify customer id. dbt: unique, not null\"\n  - name: email\n    descriptions:\n      user: Email address.\n  - name: first_name\n    descriptions:\n      user: First name.\n  - name: last_name\n    descriptions:\n      user: Last name.\n  - name: country_code\n    descriptions:\n      user: Country code.\n  - name: country_name\n    descriptions:\n      user: Country name.\n  - name: region\n    descriptions:\n      user: Reporting region (Benelux, DACH, Other EU).\n  - name: created_at\n    descriptions:\n      user: When the customer record was created.\n  - name: accepts_marketing\n    descriptions:\n      user: Marketing consent.\n  - name: first_order_at\n    descriptions:\n      user: First web order.\n  - name: first_order_channel\n    descriptions:\n      user: Channel of the first web order.\n  - name: web_orders\n    descriptions:\n      user: Number of web orders (excludes subscription renewals).\n  - name: subscriptions\n    descriptions:\n      user: Number of subscriptions the customer has had.\n  - name: is_active_subscriber\n    descriptions:\n      user: Has an active or paused non-gift subscription now.\n", "hash": "b8cf203f15"}, {"name": "fct_orders", "kind": "model", "description": "One row per Shopify order, with channel, subscription and gift flags, refunds and delivery.", "columns": [{"name": "order_id", "description": "Shopify order id. dbt: unique, not null", "tests": []}, {"name": "order_name", "description": "Order number.", "tests": []}, {"name": "customer_id", "description": "Customer.", "tests": []}, {"name": "created_at", "description": "When the order was placed (UTC).", "tests": []}, {"name": "order_date", "description": "Local date of the order.", "tests": []}, {"name": "source_name", "description": "web, subscription_contract or recharge.", "tests": []}, {"name": "channel", "description": "Marketing channel of web orders. Empty for renewals.", "tests": []}, {"name": "is_subscription_order", "description": "Subscription checkout or renewal.", "tests": []}, {"name": "is_subscription_first_order", "description": "The checkout that started a subscription.", "tests": []}, {"name": "is_subscription_renewal", "description": "Created by a scheduled subscription charge.", "tests": []}, {"name": "is_gift", "description": "Gift subscription purchase or shipment, or a Christmas gift box.", "tests": []}, {"name": "contains_bundle", "description": "Contains the Vaderdag Bundel.", "tests": []}, {"name": "items", "description": "Units on the order.", "tests": []}, {"name": "subtotal_price_eur", "description": "Line totals after discounts, including VAT.", "tests": []}, {"name": "total_discounts_eur", "description": "Discounts.", "tests": []}, {"name": "total_tax_eur", "description": "VAT included.", "tests": []}, {"name": "total_price_eur", "description": "Amount charged, including shipping.", "tests": []}, {"name": "is_refunded", "description": "Any refund against the order.", "tests": []}, {"name": "refunded_eur", "description": "Total refunded.", "tests": []}, {"name": "first_refunded_at", "description": "First refund.", "tests": []}, {"name": "carrier", "description": "PostNL or DHL.", "tests": []}, {"name": "shipped_at", "description": "Handed to the carrier.", "tests": []}, {"name": "delivered_at", "description": "Delivered.", "tests": []}, {"name": "has_failed_delivery", "description": "Carrier never delivered.", "tests": []}, {"name": "delivery_days", "description": "Local calendar days from shipping to delivery. Caveat: PostNL strike, 18 to 24 May 2026: Dutch PostNL parcels shipped in that week took 3 to 7 days and about 1% were never delivered. Late-delivery refunds rose to about 6% of those orders. Exclude the week, or say so, when comparing delivery times or refund rates.", "tests": []}], "measures": [], "segments": [], "yaml": "name: fct_orders\ndescriptions:\n  user: One row per Shopify order, with channel, subscription and gift flags, refunds and delivery.\ncolumn_overrides:\n  - name: order_id\n    descriptions:\n      user: \"Shopify order id. dbt: unique, not null\"\n  - name: order_name\n    descriptions:\n      user: Order number.\n  - name: customer_id\n    descriptions:\n      user: Customer.\n  - name: created_at\n    descriptions:\n      user: When the order was placed (UTC).\n  - name: order_date\n    descriptions:\n      user: Local date of the order.\n  - name: source_name\n    descriptions:\n      user: web, subscription_contract or recharge.\n  - name: channel\n    descriptions:\n      user: Marketing channel of web orders. Empty for renewals.\n  - name: is_subscription_order\n    descriptions:\n      user: Subscription checkout or renewal.\n  - name: is_subscription_first_order\n    descriptions:\n      user: The checkout that started a subscription.\n  - name: is_subscription_renewal\n    descriptions:\n      user: Created by a scheduled subscription charge.\n  - name: is_gift\n    descriptions:\n      user: Gift subscription purchase or shipment, or a Christmas gift box.\n  - name: contains_bundle\n    descriptions:\n      user: Contains the Vaderdag Bundel.\n  - name: items\n    descriptions:\n      user: Units on the order.\n  - name: subtotal_price_eur\n    descriptions:\n      user: Line totals after discounts, including VAT.\n  - name: total_discounts_eur\n    descriptions:\n      user: Discounts.\n  - name: total_tax_eur\n    descriptions:\n      user: VAT included.\n  - name: total_price_eur\n    descriptions:\n      user: Amount charged, including shipping.\n  - name: is_refunded\n    descriptions:\n      user: Any refund against the order.\n  - name: refunded_eur\n    descriptions:\n      user: Total refunded.\n  - name: first_refunded_at\n    descriptions:\n      user: First refund.\n  - name: carrier\n    descriptions:\n      user: PostNL or DHL.\n  - name: shipped_at\n    descriptions:\n      user: Handed to the carrier.\n  - name: delivered_at\n    descriptions:\n      user: Delivered.\n  - name: has_failed_delivery\n    descriptions:\n      user: Carrier never delivered.\n  - name: delivery_days\n    descriptions:\n      user: \"Local calendar days from shipping to delivery. Caveat: PostNL strike, 18 to 24 May 2026: Dutch PostNL parcels shipped in that week took 3 to 7 days and about 1% were never delivered. Late-delivery refunds rose to about 6% of those orders. Exclude the week, or say so, when comparing delivery times or refund rates.\"\n", "hash": "4fae8f191d"}, {"name": "fct_subscription_events", "kind": "model", "description": "Subscription events from int_subscription_events, one row per event.", "columns": [{"name": "subscription_event_id", "description": "Surrogate key. dbt: unique, not null", "tests": []}, {"name": "subscription_key", "description": "Subscription." function inline(t){
  return esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[\s(])_([^_]+)_(?=[\s).,]|$)/g,"$1<i>$2</i>");

function md(src){

  while(i < lines.length){
    const l = lines[i];

    if(/^\|/.test(l) && /^\|[\s:|-]+\|?\s*$/.test(lines[i+1]||"")){
      const row = r => r.replace(/^\||\|\s*$/g,"").split("|").map(c=>c.trim());
      out+="<table><tr>"+row(l).map(c=>`<th>${inline(c)}</th>`).join("")+"</tr>"; i+=2;
      while(i<lines.length&&/^\|/.test(lines[i])){out+="<tr>"+row(lines[i]).map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>";i++}
      out+="</table>";continue}
    if(/^\s*[-*]\s+/.test(l)){out+="<ul>";while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i]))out+=`<li>${inline(lines[i++].replace(/^\s*[-*]\s+/,""))}</li>`;out+="</ul>";continue}

function badge(item, kind){

  else if(t.dataset.wiki){S.mode="wiki";S.sel=t.dataset.wiki}
  render(); if(t.dataset.k||t.dataset.go||t.dataset.wiki) $("view").parentElement.scrollTop=0;
});
$("q").addEventListener("input", e=>{S.q=e.target.value;renderList()});
render();
</script></body></html>
