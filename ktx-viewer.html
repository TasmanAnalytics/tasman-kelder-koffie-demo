<style>
:root{--espresso:#2A1C15;--crema:#F4EADB;--baksteen:#A9462B;--gracht:#2F5B55;--honing:#D9A441;--paper:#FAF4E9;--line:#DDCFB8;--soft:#EADFCB;--muted:#7A6656;--ink:#2A1C15;
--serif:"Fraunces",Georgia,serif;--sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);display:flex;flex-direction:column}
code,.mono{font-family:var(--mono);font-size:.86em}
header{background:var(--espresso);color:var(--crema);padding:12px 20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
header h1{font:500 21px var(--serif);margin:0}
.tabs{display:flex;gap:6px}
.tab{font:500 12.5px var(--mono);letter-spacing:.04em;background:transparent;color:var(--crema);border:1px solid #5b463a;border-radius:99px;padding:6px 14px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--honing);color:var(--espresso);border-color:var(--honing)}
.blurb{font-size:13px;color:#CDBFA9;flex:1;min-width:240px}
.layout{flex:1;display:flex;min-height:0}
aside{width:340px;border-right:1px solid var(--line);background:var(--crema);display:flex;flex-direction:column;min-height:0}
.side-top{padding:12px;border-bottom:1px solid var(--line)}
.side-top input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font:14px var(--sans);color:var(--ink)}
.mode{display:flex;gap:6px;margin-bottom:10px}
.mode button{flex:1;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:7px;border:1px solid var(--line);background:var(--paper);border-radius:8px;cursor:pointer;color:var(--muted)}
.mode button[aria-pressed=true]{background:var(--gracht);color:var(--crema);border-color:var(--gracht)}
.list{overflow:auto;flex:1}
.item{display:block;width:100%;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;color:var(--ink);font:inherit}
.item:hover{background:var(--soft)}.item[aria-current=true]{background:var(--soft);box-shadow:inset 3px 0 var(--baksteen)}
.item .t{font:600 14px var(--serif);display:block}
.item .s{font-size:12px;color:var(--muted);display:block;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.grp{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--baksteen);padding:12px 14px 4px}
main{flex:1;overflow:auto;padding:28px clamp(16px,4vw,56px) 80px;min-width:0}
main .wrap{max-width:900px}
h2{font:500 32px/1.15 var(--serif);margin:0 0 6px}h3{font:600 20px var(--serif);margin:26px 0 8px}
.kicker{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--baksteen)}
.lede{color:var(--muted);margin:8px 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{font:400 12px var(--mono);border:1px solid var(--line);background:var(--crema);border-radius:99px;padding:2px 10px;color:var(--muted)}
button.chip{cursor:pointer;color:var(--gracht);border-color:var(--gracht)}button.chip:hover{background:var(--gracht);color:var(--crema)}
.badge{font:500 11px var(--mono);letter-spacing:.06em;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.b-same{background:#D6E3DF;color:var(--gracht)}.b-diff{background:#F2E1B8;color:#8A5F12}.b-only{background:#F0D9CF;color:var(--baksteen)}
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 26px 18px}
.doc h1{font:500 26px var(--serif);margin:20px 0 8px}.doc h2{font-size:22px;margin:22px 0 6px}.doc h3{font-size:17px}
.doc table{border-collapse:collapse;margin:12px 0;font-size:13.5px}.doc th,.doc td{border:1px solid var(--line);padding:5px 10px;text-align:left}.doc th{background:var(--crema)}
.doc pre,pre.yaml{background:var(--espresso);color:var(--crema);padding:14px 16px;border-radius:10px;overflow:auto;font:13px/1.5 var(--mono)}
.doc code{background:var(--soft);padding:1px 5px;border-radius:4px}.doc pre code{background:none;padding:0}
table.cols{width:100%;border-collapse:collapse;font-size:14px}
table.cols th{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:2px solid var(--line);padding:6px 8px}
table.cols td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
table.cols td:first-child{font-family:var(--mono);font-size:13px;white-space:nowrap}
.measure{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 14px;margin:8px 0}
.measure .n{font:600 14px var(--mono)}.measure .e{font:13px var(--mono);color:var(--gracht);margin:2px 0}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:8px 0 0}.stats div{font:12px var(--mono);color:#CDBFA9}.stats b{color:var(--honing);font-size:15px;margin-right:4px}
details{margin:14px 0}summary{cursor:pointer;font:13px var(--mono);color:var(--gracht)}
.empty{color:var(--muted);font-style:italic}
@media(max-width:820px){.layout{flex-direction:column}aside{width:100%;max-height:42vh}}

<script>
const DATA = [{"key": "before", "label": "Before context", "blurb": "Nothing written down. ktx works from the dbt project and the warehouse only.", "ingest": {"ktx_version": "@kaelio/ktx 0.16.0", "started": "2026-09-24T16:14:29", "finished": "2026-09-24T16:20:32", "enrichment": "llm", "embeddings": "sentence-transformers all-MiniLM-L6-v2 (384)"}, "wiki": [{"key": "email-attribution-logic", "path": "global/email-attribution-logic.md", "title": "email-attribution-logic", "summary": "Email attribution uses 5-day click window: orders attributed if profile clicked any email in previous 5 days", "tags": ["metrics", "marketing"], "sl_refs": ["metrics_email_attribution_daily"], "usage": "auto", "body": "## Email Attribution Logic\n\nKelder attributes email revenue using a **5-day click window**:\n\n**Attribution Rule**: A Klaviyo \"Placed Order\" event is attributed to email if the same profile clicked any email (campaign or flow) within the **five days before** the order.\n\n**Metrics**:\n- `attributed_orders`: Count of Placed Orders with a click in the previous 5 days\n- `attributed_revenue_eur`: Sum of order values for attributed orders\n\n**Data Source**: Klaviyo events (`Received Email`, `Opened Email`, `Clicked Email`, `Placed Order`)\n\n**Attribution Model**: Last-click within 5 days (Klaviyo's own `attributed_message_id` is available but not used in the governed metric)\n\n**Source of truth**: `metrics_email_attribution_daily`\n\n**Note**: This is a simple last-touch attribution model. Orders may also be influenced by other channels (paid ads, organic, referral) not captured in this metric.", "hash": "a550153856"}, {"key": "gift-subscription-exclusions", "path": "global/gift-subscription-exclusions.md", "title": "gift-subscription-exclusions", "summary": "Gift subscriptions excluded from churn, pause rate, and CAC metrics; identified by is_gift flag", "tags": ["subscriptions", "metrics"], "sl_refs": ["fct_subscriptions", "fct_subscription_events", "fct_orders", "metrics_subscriber_churn_monthly", "metrics_pause_rate_monthly", "metrics_new_subscribers_monthly"], "usage": "auto", "body": "## Gift Subscription Exclusions\n\nKelder tracks gift subscriptions separately and **excludes them from core subscription metrics**:\n\n**Identification**: Gift subscriptions are identified by the `is_gift` flag, which comes from:\n- Shopify subscription app: custom attribute `is_gift`\n- Recharge: property `is_gift`\n- Prepaid subscriptions (`is_prepaid = true`) are also gifts\n\n**Metric Exclusions**:\n- **Churn metrics**: Gift subscriptions excluded from both base and churned counts in `metrics_subscriber_churn_monthly`\n- **Pause rate**: Excluded from base in `metrics_pause_rate_monthly`\n- **New subscribers**: Excluded from `metrics_new_subscribers_monthly`\n- **CAC**: Gift subscriptions not counted in customer acquisition cost\n\n**Rationale**: Gift subscriptions have different lifecycle patterns (prepaid, fixed duration, no voluntary cancellation) and should not be mixed with regular recurring subscriptions in retention and acquisition metrics\n\n**Order Tracking**: Orders are flagged as gift-related via `fct_orders.is_gift` (gift subscription purchase or shipment, or Christmas gift box)\n\n**Sources of truth**: `fct_subscriptions.is_gift`, `fct_subscription_events.is_gift`, `fct_orders.is_gift`", "hash": "eb7a2c9d53"}, {"key": "marketing-channel-attribution", "path": "global/marketing-channel-attribution.md", "title": "marketing-channel-attribution", "summary": "Web order channels derived from UTM parameters and referrer: paid_social, paid_search, email, organic, referral, direct", "tags": ["marketing", "attribution"], "sl_refs": ["fct_orders", "dim_customers", "fct_subscriptions", "metrics_cac_monthly"], "usage": "auto", "body": "## Marketing Channel Attribution\n\nKelder attributes web orders to marketing channels based on UTM parameters and referrer from the landing site:\n\n**Channel Values**:\n- `paid_social`: Paid social media (Meta/Facebook/Instagram ads)\n- `paid_search`: Paid search (Google Ads)\n- `email`: Email marketing (Klaviyo)\n- `organic`: Organic search\n- `referral`: Referral from another site\n- `direct`: Direct traffic (no referrer or UTM)\n\n**Attribution Logic**:\n- Derived from `utm_source`, `utm_medium`, `utm_campaign`, `landing_site`, and `referring_site` on the order\n- Only applies to **web orders** (`source_name = 'web'`)\n- Subscription renewals (`source_name = 'subscription_contract'` or `'recharge'`) have empty channel\n\n**First Order Channel**: The channel of a customer's first web order is captured on `dim_customers.first_order_channel` and `fct_subscriptions.first_order_channel` for acquisition analysis\n\n**CAC Calculation**: Customer acquisition cost is calculated per channel using ad spend and new subscribers whose first order came through that channel\n\n**Sources of truth**: `fct_orders`, `dim_customers`, `fct_subscriptions`, `metrics_cac_monthly`", "hash": "c98ebe3068"}, {"key": "payment-retry-dunning-logic", "path": "global/payment-retry-dunning-logic.md", "title": "payment-retry-dunning-logic", "summary": "Failed payments retry on days 1, 3, 7, 14, 21, 28; billing gives up on day 30 with max_retries_reached cancellation", "tags": ["subscriptions", "billing"], "sl_refs": ["fct_subscription_events"], "usage": "auto", "body": "## Payment Retry and Dunning Logic\n\nKelder's subscription billing follows this retry schedule for failed payments:\n\n**Billing Schedule**:\n- Initial billing: 05:00 Amsterdam time on the scheduled billing date\n- Retries on days: 1, 3, 7, 14, 21, 28 after the first failure\n- Final attempt: Day 30\n\n**Dunning Episode**: A billing cycle with a failed payment is tracked as a \"dunning episode\" in `int_payment_episodes`\n\n**Recovery Window**: A payment is considered \"recovered within 30 days\" if any retry succeeds within 30 days of the first failure\n\n**Cancellation**: If all retries fail, billing gives up on day 30 and cancels the subscription with reason `max_retries_reached`\n\n**Event Types**:\n- `payment_failed`: First failed payment of a billing cycle\n- `payment_recovered`: A retry succeeded after a failure\n\n**Churn Impact**: Subscriptions whose payment failed in a month (and did not recover) count as churned in that month, even if the formal cancellation happens later\n\n**Sources of truth**: `int_payment_episodes`, `int_charges_unified`, `fct_subscription_events`", "hash": "2be37b3b06"}, {"key": "product-type-taxonomy", "path": "global/product-type-taxonomy.md", "title": "product-type-taxonomy", "summary": "Kelder product types: single_origin, blend, decaf, equipment, gift_box, gift_subscription, bundle", "tags": ["products", "taxonomy"], "sl_refs": [], "usage": "auto", "body": "## Product Type Taxonomy\n\nKelder's product catalogue uses these product types:\n\n**Coffee Products**:\n- `single_origin`: Single-origin coffee beans\n- `blend`: Coffee blends\n- `decaf`: Decaffeinated coffee\n\n**Non-Coffee Products**:\n- `equipment`: Coffee brewing equipment\n- `gift_box`: Gift boxes (e.g., Christmas gift boxes)\n- `gift_subscription`: Prepaid gift subscription products\n- `bundle`: Product bundles (e.g., Vaderdag Bundel)\n\n**Source**: Shopify product metadata, captured in `stg_shopify__products.product_type` and joined to variants and orders\n\n**Usage**: Product type is available on `fct_orders` via line items and on `fct_subscriptions` via the subscribed variant", "hash": "8f671566ad"}, {"key": "reporting-timezone-conventions", "path": "global/reporting-timezone-conventions.md", "title": "reporting-timezone-conventions", "summary": "All reporting uses Europe/Amsterdam timezone; month boundaries at 00:00 local time; fiscal year starts January", "tags": ["conventions", "data-model"], "sl_refs": [], "usage": "auto", "body": "## Reporting Timezone and Date Conventions\n\n**Reporting Timezone**: `Europe/Amsterdam` (CET/CEST)\n\nAll date boundaries in Kelder's reporting use Amsterdam local time:\n- Month boundaries: 00:00 Amsterdam time on the first of the month\n- Day boundaries: 00:00 Amsterdam time\n- Billing runs: 05:00 Amsterdam time\n\n**Fiscal Year**: Starts January 1 (calendar year)\n\n**Reporting Period**: Metrics cover full months before the `as_of_date` variable (currently `2026-07-01`), starting from `first_reporting_month` (`2025-01-01`)\n\n**UTC Storage**: Raw event timestamps are stored in UTC but converted to Amsterdam time for reporting boundaries\n\n**Sources**:\n- `int_reporting_months`: Calendar months with start/end instants at 00:00 Amsterdam time\n- dbt project vars: `as_of_date`, `first_reporting_month`, `reporting_timezone`", "hash": "ac52c968f3"}, {"key": "shipping-regions-carriers", "path": "global/shipping-regions-carriers.md", "title": "shipping-regions-carriers", "summary": "Kelder ships to Benelux, DACH, and Other EU; PostNL for Netherlands, DHL elsewhere", "tags": ["operations", "geography"], "sl_refs": ["fct_orders", "dim_customers"], "usage": "auto", "body": "## Shipping Regions and Carriers\n\n**Supported Countries**: Kelder ships to 5 countries (ISO 3166-1 alpha-2):\n- `NL`: Netherlands\n- `BE`: Belgium\n- `DE`: Germany\n- `LU`: Luxembourg\n- `FR`: France\n\n**Reporting Regions**:\n- **Benelux**: Netherlands, Belgium, Luxembourg\n- **DACH**: Germany (Österreich and Schweiz not currently supported)\n- **Other EU**: France and any other EU countries\n\n**Carrier Assignment**:\n- **PostNL**: Netherlands\n- **DHL**: All other countries (Belgium, Germany, Luxembourg, France)\n\n**Delivery Tracking**: `fct_orders` includes `carrier`, `shipped_at`, `delivered_at`, `has_failed_delivery`, and `delivery_days` (local calendar days from shipping to delivery)\n\n**Source**: `seeds/countries` seed file defines country-to-region mapping and default carrier", "hash": "7bcfe9eef0"}, {"key": "subscriber-churn-definition", "path": "global/subscriber-churn-definition.md", "title": "subscriber-churn-definition", "summary": "Governed monthly subscriber churn: voluntary cancellations + payment failures, over active/paused base at month start", "tags": ["metrics", "subscriptions"], "sl_refs": ["metrics_subscriber_churn_monthly", "fct_subscriptions", "fct_subscription_events"], "usage": "auto", "body": "## Subscriber Churn Definition\n\nKelder's governed monthly subscriber churn metric follows this definition:\n\n**Base**: Subscriptions that are active or paused at 00:00 Amsterdam time on the first of the month, **excluding gift subscriptions**.\n\n**Churned**: Subscriptions counted as churned in the month include:\n- Voluntary cancellations (customer-initiated)\n- Subscriptions whose payment failed in the month (dunning episodes that did not recover)\n\n**Churn Rate**: `churned_subscribers / base_subscribers`\n\n**Key exclusions**:\n- Gift subscriptions are excluded from both base and churned counts\n- Paused subscriptions are included in the base (they are still active subscribers)\n- Only voluntary cancellations and payment failures count as churn; expired subscriptions are handled separately\n\n**Source of truth**: `metrics_subscriber_churn_monthly`\n\n**Timezone**: All month boundaries use Europe/Amsterdam timezone (00:00 local time on the first of the month).", "hash": "1eb050683e"}, {"key": "subscription-billing-intervals", "path": "global/subscription-billing-intervals.md", "title": "subscription-billing-intervals", "summary": "Subscription billing intervals: 2, 4, or 6 weeks (14, 28, or 42 days); MRR normalized to 30-day month", "tags": ["subscriptions", "billing"], "sl_refs": ["fct_subscriptions"], "usage": "auto", "body": "## Subscription Billing Intervals\n\nKelder offers three subscription billing intervals:\n\n**Interval Options**:\n- **2 weeks** (14 days)\n- **4 weeks** (28 days)\n- **6 weeks** (42 days)\n\n**Interval Storage**:\n- Shopify subscription app: `billing_interval = 'WEEK'` with `billing_interval_count` (2, 4, or 6)\n- Recharge: `interval_days` (14, 28, or 42)\n- Unified model: `interval_days` in `fct_subscriptions`\n\n**MRR Calculation**: Monthly Recurring Revenue (MRR) is calculated by normalizing the subscription price to a 30-day month:\n- `mrr_eur = (price_eur / interval_days) * 30`\n- Only active subscriptions contribute to MRR (paused, cancelled, and expired subscriptions have `mrr_eur = 0`)\n\n**Quantity**: Subscriptions specify `quantity` (bags per shipment), typically 1 or 2\n\n**Source of truth**: `fct_subscriptions.interval_days`, `fct_subscriptions.mrr_eur`", "hash": "af7422b93b"}, {"key": "unified-subscription-model", "path": "global/unified-subscription-model.md", "title": "unified-subscription-model", "summary": "Subscription key logic: stable identifiers across Shopify and Recharge migrations with unified status mapping", "tags": ["subscriptions", "data-model"], "sl_refs": ["fct_subscriptions"], "usage": "auto", "body": "## Unified Subscription Model\n\nKelder tracks subscriptions across two billing systems (Shopify subscription app and Recharge) using a unified subscription key that remains stable across migrations.\n\n**Subscription Key Format**:\n- `shp-<contract_id>` for subscriptions that started in Shopify\n- `rch-<subscription_id>` for subscriptions that started in Recharge without a Shopify contract\n\n**Key Stability**: When a Recharge subscription continues a Shopify contract (via `external_contract_id`), it keeps the Shopify contract's key (`shp-<contract_id>`), ensuring continuity across the migration.\n\n**Unified Status Mapping**:\nThe `int_subscriptions_unified` model maps platform-specific statuses to a unified status:\n- **active**: Currently billing\n- **paused**: Active subscription with `paused_until` set (Recharge has no paused status; paused subscriptions are 'active' with `paused_until`)\n- **cancelled**: Customer-initiated cancellation or billing gave up (`max_retries_reached`)\n- **expired**: Prepaid gift subscription completed\n\n**Source Systems**:\n- Shopify subscription app: `source_stat
