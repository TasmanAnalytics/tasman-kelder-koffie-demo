name: kelder
version: "1.0.0"
config-version: 2
profile: kelder

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Reporting date. Metrics cover full months before this date.
  as_of_date: "2026-07-01"
  first_reporting_month: "2025-01-01"
  reporting_timezone: "Europe/Amsterdam"

models:
  kelder:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: main
      +materialized: table
    context:
      +schema: context
      +materialized: table

seeds:
  kelder:
    +schema: reference
