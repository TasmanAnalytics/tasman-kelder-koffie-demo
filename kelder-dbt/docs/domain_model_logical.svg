<text x="60" y="62" font-family="Fraunces, Georgia, serif" font-size="34" fill="#2A1C15" font-weight="500" text-anchor="start" font-style="normal">Kelder domain model, logical view</text>
<text x="60" y="92" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0.4">WHAT KELDER IS MADE OF, BEFORE ANY SOURCE SYSTEM</text>
<g transform="translate(1540,58)"><rect x="-292" y="-22" width="292" height="34" rx="17" fill="none" stroke="#A9462B" stroke-width="1.6"/>
<text x="-146" y="0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#A9462B" font-weight="500" text-anchor="middle" font-style="normal" letter-spacing="1">KELDER KOFFIE · DOMAIN MODEL</text></g>
<rect x="50" y="170" width="280" height="206" rx="14" fill="#FAF4E9" stroke="#2A1C15" stroke-width="2.4"/><path d="M50 184a14 14 0 0 1 14 -14h252a14 14 0 0 1 14 14v30h-280z" fill="#2A1C15"/><text x="70" y="202" font-family="Fraunces, Georgia, serif" font-size="25" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">Customer</text><text x="70" y="242" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">A person who buys from</text><text x="70" y="263" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Kelder.</text><line x1="70" x2="310" y1="286" y2="286" stroke="#CDBFA9"/><text x="70" y="308" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">customer id</text><text x="70" y="332" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">country</text><text x="70" y="356" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">first order channel</text><rect x="450" y="170" width="320" height="230" rx="14" fill="#FAF4E9" stroke="#2F5B55" stroke-width="2.4"/><path d="M450 184a14 14 0 0 1 14 -14h292a14 14 0 0 1 14 14v30h-320z" fill="#2F5B55"/><text x="470" y="202" font-family="Fraunces, Georgia, serif" font-size="25" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">Subscription</text><text x="470" y="242" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">A standing order for coffee.</text><text x="470" y="263" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Recurring or gift.</text><line x1="470" x2="750" y1="286" y2="286" stroke="#CDBFA9"/><text x="470" y="308" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">subscription id</text><text x="470" y="332" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">type: recurring | gift</text><text x="470" y="356" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">product, interval, price</text><text x="470" y="380" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">started at</text><rect x="890" y="170" width="330" height="254" rx="14" fill="#FAF4E9" stroke="#A9462B" stroke-width="2.4"/><path d="M890 184a14 14 0 0 1 14 -14h302a14 14 0 0 1 14 14v30h-330z" fill="#A9462B"/><text x="910" y="202" font-family="Fraunces, Georgia, serif" font-size="25" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">Status change</text><text x="910" y="242" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Something that happened to a</text><text x="910" y="263" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">subscription&#x27;s state.</text><line x1="910" x2="1200" y1="286" y2="286" stroke="#CDBFA9"/><text x="910" y="308" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">kind: started | paused |</text><text x="910" y="332" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">      resumed | cancelled | expired</text><text x="910" y="356" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">occurred at</text><text x="910" y="380" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#A9462B" font-weight="400" text-anchor="start" font-style="normal">*initiator: customer | dunning | ops</text><text x="910" y="404" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#A9462B" font-weight="400" text-anchor="start" font-style="normal">*reason</text><rect x="1330" y="170" width="230" height="182" rx="14" fill="#FAF4E9" stroke="#A9462B" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M1330 184a14 14 0 0 1 14 -14h202a14 14 0 0 1 14 14v30h-230z" fill="#A9462B"/><text x="1350" y="202" font-family="Fraunces, Georgia, serif" font-size="25" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">Held for review</text><text x="1350" y="242" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Refused by the</text><text x="1350" y="263" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">rule. Not churn.</text><line x1="1350" x2="1540" y1="286" y2="286" stroke="#CDBFA9"/><text x="1350" y="308" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">source row</text><text x="1350" y="332" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">rule broken</text><rect x="300" y="560" width="340" height="206" rx="14" fill="#FAF4E9" stroke="#2A1C15" stroke-width="2.4"/><path d="M300 574a14 14 0 0 1 14 -14h312a14 14 0 0 1 14 14v30h-340z" fill="#2A1C15"/><text x="320" y="592" font-family="Fraunces, Georgia, serif" font-size="25" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">Delivery</text><text x="320" y="632" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">A parcel sent for a</text><text x="320" y="653" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">subscription.</text><line x1="320" x2="620" y1="676" y2="676" stroke="#CDBFA9"/><text x="320" y="698" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">shipped at, delivered at</text><text x="320" y="722" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">carrier</text><text x="320" y="746" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">failed: yes | no</text><rect x="720" y="560" width="340" height="206" rx="14" fill="#FAF4E9" stroke="#2A1C15" stroke-width="2.4"/><path d="M720 574a14 14 0 0 1 14 -14h312a14 14 0 0 1 14 14v30h-340z" fill="#2A1C15"/><text x="740" y="592" font-family="Fraunces, Georgia, serif" font-size="25" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">Payment attempt</text><text x="740" y="632" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">A try at charging the</text><text x="740" y="653" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">card for a renewal.</text><line x1="740" x2="1040" y1="676" y2="676" stroke="#CDBFA9"/><text x="740" y="698" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">attempted at</text><text x="740" y="722" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">outcome: paid | failed</text><text x="740" y="746" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">recovered at</text><line x1="330" y1="300" x2="450" y2="300" stroke="#2A1C15" stroke-width="2.4"/><path d="M450 300L434.0 308.0L434.0 292.0Z" fill="#2A1C15"/><rect x="343.6" y="255" width="92.8" height="28" rx="14" fill="#F4EADB" stroke="#CDBFA9"/><text x="390" y="275" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#2A1C15" font-weight="500" text-anchor="middle" font-style="normal">has many</text><line x1="770" y1="300" x2="890" y2="300" stroke="#2A1C15" stroke-width="2.4"/><path d="M890 300L874.0 308.0L874.0 292.0Z" fill="#2A1C15"/><rect x="787.9" y="255" width="84.19999999999999" height="28" rx="14" fill="#F4EADB" stroke="#CDBFA9"/><text x="830" y="275" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#2A1C15" font-weight="500" text-anchor="middle" font-style="normal">records</text><line x1="1220" y1="300" x2="1330" y2="300" stroke="#A9462B" stroke-width="2.4" stroke-dasharray="8 6"/><path d="M1330 300L1314.0 308.0L1314.0 292.0Z" fill="#A9462B"/><text x="1275" y="286" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5" fill="#A9462B" font-weight="500" text-anchor="middle" font-style="normal">no initiator,</text><text x="1275" y="332" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5" fill="#A9462B" font-weight="500" text-anchor="middle" font-style="normal">no reason</text><path d="M610 400 V500 H470 V560 M610 500 H890 V560" fill="none" stroke="#2A1C15" stroke-width="2.4"/><path d="M470 560l-8 -16h16z" fill="#2A1C15"/><path d="M890 560l-8 -16h16z" fill="#2A1C15"/><text x="540" y="486" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="500" text-anchor="middle" font-style="normal">is delivered by</text><text x="750" y="486" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#7A6656" font-weight="500" text-anchor="middle" font-style="normal">is billed through</text><rect x="1120" y="560" width="450" height="240" rx="14" fill="#2A1C15"/><text x="1146" y="600" font-family="Fraunces, Georgia, serif" font-size="26" fill="#D9A441" font-weight="600" text-anchor="start" font-style="normal">The rule that matters</text><text x="1146" y="640" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#F4EADB" font-weight="400" text-anchor="start" font-style="normal">A cancellation must have an initiator</text><text x="1146" y="663" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#F4EADB" font-weight="400" text-anchor="start" font-style="normal">and a reason.</text><text x="1146" y="686" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#F4EADB" font-weight="400" text-anchor="start" font-style="normal"></text><text x="1146" y="709" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#F4EADB" font-weight="400" text-anchor="start" font-style="normal">The 12 March import rows have neither,</text><text x="1146" y="732" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#F4EADB" font-weight="400" text-anchor="start" font-style="normal">so the domain layer refuses to call them</text><text x="1146" y="755" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#F4EADB" font-weight="400" text-anchor="start" font-style="normal">cancellations and holds them for review.</text><text x="60" y="800" font-family="Caveat, 'Bradley Hand', cursive" font-size="19" fill="#A9462B" font-weight="600" text-anchor="start" font-style="normal">A pause is a state, never a cancellation.</text><text x="60" y="830" font-family="Caveat, 'Bradley Hand', cursive" font-size="19" fill="#A9462B" font-weight="600" text-anchor="start" font-style="normal">A gift is a type of subscription with no recurring revenue.</text>
<text x="60" y="878" font-family="'JetBrains Mono', Menlo, monospace" font-size="13.5" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">Written before looking at any data source. Shopify and Recharge map into this; nothing downstream reads them directly.</text>
</svg>
