name: metrics_email_attribution_daily
descriptions:
  user: "Daily email activity and email-attributed revenue: Klaviyo Placed Order value where the same profile clicked an email within the five days before the order. Caveat: No Klaviyo data from 2026-04-09 06:00 UTC to 2026-04-10 13:00 UTC (Fivetran connector outage, never backfilled); figures for 9 and 10 April are incomplete. Orders placed up to five days later lost the clicks that would have attributed them, so attributed revenue is understated until 15 April. Shopify orders are complete. See context.business_events."
column_overrides:
  - name: day
    descriptions:
      user: "Local date. dbt: unique, not null"
  - name: is_incomplete
    descriptions:
      user: True for 9 to 15 April 2026, the days touched by the Klaviyo connector outage.
  - name: emails_received
    descriptions:
      user: Received Email events.
  - name: emails_opened
    descriptions:
      user: Opened Email events.
  - name: emails_clicked
    descriptions:
      user: Clicked Email events.
  - name: placed_orders
    descriptions:
      user: Placed Order events.
  - name: placed_order_revenue_eur
    descriptions:
      user: Value of Placed Order events.
  - name: attributed_orders
    descriptions:
      user: Placed Orders with a click in the previous five days.
  - name: attributed_revenue_eur
    descriptions:
      user: Email-attributed revenue.
