name: fct_subscriptions
descriptions:
  user: One row per subscription key, with status, churn timestamp, MRR and acquisition channel.
column_overrides:
  - name: subscription_key
    descriptions:
      user: "Stable subscription key. dbt: unique, not null"
  - name: customer_id
    descriptions:
      user: Customer.
  - name: origin_system
    descriptions:
      user: shopify or recharge.
  - name: shopify_contract_id
    descriptions:
      user: Shopify contract id, if any.
  - name: recharge_subscription_id
    descriptions:
      user: Recharge subscription id, if any.
  - name: started_at
    descriptions:
      user: When the subscription started.
  - name: started_date
    descriptions:
      user: Local (Amsterdam) date the subscription started.
  - name: churned_at
    descriptions:
      user: "Timestamp the subscription entered a terminal cancelled state. Caveat: The 2026-03-12 Recharge backfill wrote churned_at for ~1,900 paused subscriptions. These rows carry is_migration_artifact = true and are excluded from churn metrics as of v2026.03.2."
  - name: ended_at
    descriptions:
      user: When the subscription ended (cancelled or expired).
  - name: status
    descriptions:
      user: "Unified subscription status. Caveat: Shopify and Recharge use different source values (ACTIVE, PAUSED, CANCELLED, FAILED, EXPIRED in Shopify; active, cancelled, expired plus paused_until in Recharge); unified in one intermediate model, int_subscriptions_unified. Current status only: for status at a point in time use the event stream."
  - name: cancellation_reason
    descriptions:
      user: Reason, for cancelled subscriptions.
  - name: is_gift
    descriptions:
      user: Prepaid gift subscription.
  - name: interval_days
    descriptions:
      user: Days between shipments.
  - name: quantity
    descriptions:
      user: Bags per shipment.
  - name: variant_id
    descriptions:
      user: Coffee variant.
  - name: sku
    descriptions:
      user: Coffee SKU.
  - name: product_title
    descriptions:
      user: Coffee name.
  - name: price_eur
    descriptions:
      user: Price per shipment.
  - name: mrr_eur
    descriptions:
      user: "MRR attributed to the subscription (price per shipment normalised to a month, active subscriptions only). Caveat: Zero for gift subscriptions by design. Gifts are prepaid for three shipments, paid once at purchase, and sit outside subscriber metrics (context/quirks/gift_subscriptions.md)."
  - name: payment_method
    descriptions:
      user: Payment method, where known.
  - name: origin_order_id
    descriptions:
      user: Checkout order that started the subscription.
  - name: first_order_channel
    descriptions:
      user: Channel of that checkout order.
  - name: is_migration_artifact
    descriptions:
      user: True for subscriptions that were paused at the last Shopify sync and arrived in Recharge as cancelled at 2026-03-12 00:00:00 UTC with no reason (decision 0007). They were not cancelled. Excluded from churn metrics.
  - name: is_legacy_pause_restore
    descriptions:
      user: "True for Recharge subscriptions re-created by operations for a customer whose pause was wiped by the migration (properties.restore_source = legacy_pause). Caveat: Restores are continuations, not new subscribers. The restore continues the original subscription's key and tenure (continues_subscription_key). Exclude restores from new subscriber counts and from acquisition metrics."
  - name: continues_subscription_key
    descriptions:
      user: For restores, the key of the original subscription they continue.
