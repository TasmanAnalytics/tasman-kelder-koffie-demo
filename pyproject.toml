[project]
name = "tasman-kelder-koffie"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "faker>=40.39.0",
    "matplotlib>=3.11.2",
    "mcp-server-motherduck==1.0.8",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
markers = ["slow: takes more than a few seconds"]
