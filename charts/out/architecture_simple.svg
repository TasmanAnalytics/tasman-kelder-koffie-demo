<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="How the demo is wired">
<rect width="1600" height="900" fill="#F4EADB"/>
<text x="60" y="62" font-family="Fraunces, Georgia, serif" font-size="34" fill="#2A1C15" font-weight="500" text-anchor="start" font-style="normal">How the demo is wired</text>
<text x="60" y="92" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0.4">ONE QUESTION, ONE AGENT, TWO SOURCES</text>
<g transform="translate(1540,58)"><rect x="-292" y="-22" width="292" height="34" rx="17" fill="none" stroke="#A9462B" stroke-width="1.6"/>
<text x="-146" y="0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#A9462B" font-weight="500" text-anchor="middle" font-style="normal" letter-spacing="1">SIMPLIFIED VIEW</text></g>
<rect x="60" y="170" width="400" height="250" rx="18" fill="#FAF4E9" stroke="#2A1C15" stroke-width="3"/><path d="M60 188a18 18 0 0 1 18 -18h364a18 18 0 0 1 18 18v52h-400z" fill="#2A1C15"/><text x="86" y="216" font-family="Fraunces, Georgia, serif" font-size="32" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">The data</text><text x="86" y="278" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" fill="#2A1C15" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0.5">DUCKDB, BUILT BY DBT</text><text x="86" y="314" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Kelder&#x27;s warehouse:</text><text x="86" y="343" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">subscriptions, orders,</text><text x="86" y="372" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">cancellations, churn.</text><rect x="600" y="170" width="400" height="250" rx="18" fill="#FAF4E9" stroke="#2F5B55" stroke-width="3"/><path d="M600 188a18 18 0 0 1 18 -18h364a18 18 0 0 1 18 18v52h-400z" fill="#2F5B55"/><text x="626" y="216" font-family="Fraunces, Georgia, serif" font-size="32" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">ktx</text><text x="626" y="278" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" fill="#2F5B55" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0.5">THE AGENT&#x27;S DOOR TO THE DATA</text><text x="626" y="314" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Runs the agent&#x27;s SQL,</text><text x="626" y="343" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">read-only. Also offers</text><text x="626" y="372" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">its own inferred wiki.</text><rect x="1140" y="170" width="400" height="250" rx="18" fill="#FAF4E9" stroke="#A9462B" stroke-width="3"/><path d="M1140 188a18 18 0 0 1 18 -18h364a18 18 0 0 1 18 18v52h-400z" fill="#A9462B"/><text x="1166" y="216" font-family="Fraunces, Georgia, serif" font-size="32" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">Claude</text><text x="1166" y="278" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" fill="#A9462B" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0.5">THE AGENT</text><text x="1166" y="314" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Answers the question.</text><text x="1166" y="343" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Queries data through ktx,</text><text x="1166" y="372" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">reads the notes directly.</text><rect x="600" y="540" width="400" height="220" rx="18" fill="#FAF4E9" stroke="#D9A441" stroke-width="3"/><path d="M600 558a18 18 0 0 1 18 -18h364a18 18 0 0 1 18 18v52h-400z" fill="#D9A441"/><text x="626" y="586" font-family="Fraunces, Georgia, serif" font-size="32" fill="#2A1C15" font-weight="600" text-anchor="start" font-style="normal">The written notes</text><text x="626" y="648" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" fill="#8A5F12" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0.5">IN THE TEAM&#x27;S GIT REPO</text><text x="626" y="684" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">AGENTS.md, decision records,</text><text x="626" y="713" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">caveats, verified queries.</text><line x1="600" y1="320" x2="478.0" y2="320.0" stroke="#2A1C15" stroke-width="4"/><path d="M460 320L482.0 309.0L482.0 331.0Z" fill="#2A1C15"/><rect x="499.25" y="278.0" width="61.5" height="36" rx="18" fill="#F4EADB" stroke="#2A1C15" stroke-width="1.6"/><text x="530.0" y="304.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="17" fill="#2A1C15" font-weight="600" text-anchor="middle" font-style="normal">SQL</text><line x1="1140" y1="320" x2="1018.0" y2="320.0" stroke="#2F5B55" stroke-width="4"/><path d="M1000 320L1022.0 309.0L1022.0 331.0Z" fill="#2F5B55"/><rect x="1002.5" y="278.0" width="135.0" height="36" rx="18" fill="#F4EADB" stroke="#2F5B55" stroke-width="1.6"/><text x="1070.0" y="304.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="17" fill="#2F5B55" font-weight="600" text-anchor="middle" font-style="normal">tool calls</text><line x1="1000" y1="650" x2="1246.518061875173" y2="431.92632987965453" stroke="#8A5F12" stroke-width="4"/><path d="M1260 420L1250.8103883294448 442.8155875958608L1236.2337629209783 426.33766322107243Z" fill="#8A5F12"/><rect x="1131.25" y="540" width="187.5" height="36" rx="18" fill="#F4EADB" stroke="#8A5F12" stroke-width="1.6"/><text x="1225" y="566" font-family="'JetBrains Mono', Menlo, monospace" font-size="17" fill="#8A5F12" font-weight="600" text-anchor="middle" font-style="normal">reads the files</text><text x="80" y="640" font-family="Caveat, 'Bradley Hand', cursive" font-size="26" fill="#A9462B" font-weight="600" text-anchor="start" font-style="normal">Without the notes, the agent</text><text x="80" y="676" font-family="Caveat, 'Bradley Hand', cursive" font-size="26" fill="#A9462B" font-weight="600" text-anchor="start" font-style="normal">finds the odd batch but not why.</text><text x="80" y="730" font-family="Caveat, 'Bradley Hand', cursive" font-size="26" fill="#2F5B55" font-weight="600" text-anchor="start" font-style="normal">With them, it gets 3.3% and says why.</text>
<text x="60" y="878" font-family="'JetBrains Mono', Menlo, monospace" font-size="13.5" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">Simplified. In the trials the notes reached Claude through the repo files, not through ktx.</text>
</svg>
