<text x="-146" y="0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#A9462B" font-weight="500" text-anchor="middle" font-style="normal" letter-spacing="1">KELDER KOFFIE DEMO</text></g>
<path d="M60 250h300a24 24 0 0 1 24 24v112a24 24 0 0 1 -24 24h-230l-40 34v-34h-30a24 24 0 0 1 -24 -24v-112a24 24 0 0 1 24 -24z" fill="#2A1C15"/><text x="84" y="300" font-family="Caveat, 'Bradley Hand', cursive" font-size="27" fill="#F4EADB" font-weight="400" text-anchor="start" font-style="normal">“What was churn in</text><text x="84" y="334" font-family="Caveat, 'Bradley Hand', cursive" font-size="27" fill="#F4EADB" font-weight="400" text-anchor="start" font-style="normal">March? One number</text><text x="84" y="368" font-family="Caveat, 'Bradley Hand', cursive" font-size="27" fill="#F4EADB" font-weight="400" text-anchor="start" font-style="normal">for the board.”</text><text x="60" y="478" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#7A6656" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="1">SAME QUESTION, EVERY RUN</text><rect x="470" y="210" width="300" height="240" rx="20" fill="#FAF4E9" stroke="#A9462B" stroke-width="3"/><path d="M470 230a20 20 0 0 1 20 -20h260a20 20 0 0 1 20 20v44h-300z" fill="#A9462B"/><text x="496" y="254" font-family="Fraunces, Georgia, serif" font-size="30" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">Claude</text><text x="496" y="310" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#A9462B" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="0.8">THE AGENT</text><text x="496" y="342" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Plans, looks things up,</text><text x="496" y="371" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">runs queries, answers.</text><line x1="384" y1="330" x2="450.0" y2="330.0" stroke="#2A1C15" stroke-width="4" stroke-linecap="round"/><path d="M470 330L446.0 342.0L446.0 318.0Z" fill="#2A1C15"/><rect x="890" y="150" width="290" height="190" rx="20" fill="#FAF4E9" stroke="#2F5B55" stroke-width="3"/><path d="M890 170a20 20 0 0 1 20 -20h250a20 20 0 0 1 20 20v44h-290z" fill="#2F5B55"/><text x="916" y="194" font-family="Fraunces, Georgia, serif" font-size="30" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">ktx</text><text x="916" y="250" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#2F5B55" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="0.8">THE DOOR TO THE DATA</text><text x="916" y="282" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Runs its SQL,</text><text x="916" y="311" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">read-only.</text><rect x="1260" y="150" width="290" height="190" rx="20" fill="#FAF4E9" stroke="#2A1C15" stroke-width="3"/><path d="M1260 170a20 20 0 0 1 20 -20h250a20 20 0 0 1 20 20v44h-290z" fill="#2A1C15"/><text x="1286" y="194" font-family="Fraunces, Georgia, serif" font-size="30" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">Warehouse</text><text x="1286" y="250" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#2A1C15" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="0.8">DUCKDB</text><text x="1286" y="282" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Kelder&#x27;s numbers,</text><text x="1286" y="311" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">built by dbt.</text><line x1="770" y1="290" x2="871.2734164486191" y2="252.02246883176784" stroke="#2F5B55" stroke-width="4" stroke-linecap="round"/><path d="M890 245L871.7415810374036 264.66291272894995L863.3146184392822 242.19101246729286Z" fill="#2F5B55"/><line x1="1180" y1="245" x2="1240.0" y2="245.0" stroke="#2A1C15" stroke-width="4" stroke-linecap="round"/><path d="M1260 245L1236.0 257.0L1236.0 233.0Z" fill="#2A1C15"/><rect x="890" y="400" width="660" height="200" rx="20" fill="#FAF4E9" stroke="#D9A441" stroke-width="3"/><path d="M890 420a20 20 0 0 1 20 -20h620a20 20 0 0 1 20 20v44h-660z" fill="#D9A441"/><text x="916" y="444" font-family="Fraunces, Georgia, serif" font-size="30" fill="#2A1C15" font-weight="600" text-anchor="start" font-style="normal">The written notes</text><text x="916" y="500" font-family="'JetBrains Mono', Menlo, monospace" font-size="14" fill="#8A5F12" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="0.8">WHY THE NUMBERS ARE WHAT THEY ARE</text><text x="916" y="548" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Decision 0007: the 12 March import</text><text x="916" y="575" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">wrote paused subscriptions as cancelled.</text><line x1="1300" y1="478" x2="1300" y2="584" stroke="#CDBFA9" stroke-width="1.5"/><text x="1320" y="500" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" fill="#8A5F12" font-weight="700" text-anchor="start" font-style="normal">Two ways in:</text><text x="1320" y="530" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">1  AGENTS.md in the repo</text><text x="1320" y="560" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">2  the ktx wiki</text><line x1="770" y1="390" x2="873.3589941132432" y2="458.9059960754954" stroke="#8A5F12" stroke-width="4" stroke-linecap="round"/><path d="M890 470L863.374390581189 466.6717988226486L876.6871952905946 446.7025917585404Z" fill="#8A5F12"/><text x="60" y="668" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#7A6656" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="1">THREE SET-UPS, SAME QUESTION</text><rect x="60" y="684" width="470" height="118" rx="16" fill="#FAF4E9" stroke="#CDBFA9" stroke-width="2"/><rect x="60" y="684" width="10" height="118" rx="5" fill="#A9462B"/><text x="92" y="730" font-family="Fraunces, Georgia, serif" font-size="22" fill="#2A1C15" font-weight="600" text-anchor="start" font-style="normal">No notes</text><text x="92" y="764" font-family="'JetBrains Mono', Menlo, monospace" font-size="14.5" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">finds the odd batch, not why</text><text x="500" y="768" font-family="Caveat, 'Bradley Hand', cursive" font-size="30" fill="#A9462B" font-weight="600" text-anchor="end" font-style="normal">why ?</text><rect x="560" y="684" width="470" height="118" rx="16" fill="#FAF4E9" stroke="#CDBFA9" stroke-width="2"/><rect x="560" y="684" width="10" height="118" rx="5" fill="#2F5B55"/><text x="592" y="730" font-family="Fraunces, Georgia, serif" font-size="22" fill="#2A1C15" font-weight="600" text-anchor="start" font-style="normal">Notes in the repo</text><text x="592" y="764" font-family="'JetBrains Mono', Menlo, monospace" font-size="14.5" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">AGENTS.md, read at start</text><text x="1000" y="768" font-family="Caveat, 'Bradley Hand', cursive" font-size="30" fill="#2F5B55" font-weight="600" text-anchor="end" font-style="normal">why ✓</text><rect x="1060" y="684" width="470" height="118" rx="16" fill="#FAF4E9" stroke="#CDBFA9" stroke-width="2"/><rect x="1060" y="684" width="10" height="118" rx="5" fill="#2F5B55"/><text x="1092" y="730" font-family="Fraunces, Georgia, serif" font-size="22" fill="#2A1C15" font-weight="600" text-anchor="start" font-style="normal">Notes in the ktx wiki</text><text x="1092" y="764" font-family="'JetBrains Mono', Menlo, monospace" font-size="14.5" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">found with wiki_search</text><text x="1500" y="768" font-family="Caveat, 'Bradley Hand', cursive" font-size="30" fill="#2F5B55" font-weight="600" text-anchor="end" font-style="normal">why ✓</text>
<text x="60" y="878" font-family="'JetBrains Mono', Menlo, monospace" font-size="13.5" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">Same model, same warehouse, same question; only where the notes live changes.</text>
