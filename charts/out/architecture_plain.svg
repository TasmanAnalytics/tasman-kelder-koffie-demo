<g transform="translate(1540,58)"><rect x="-292" y="-22" width="292" height="34" rx="17" fill="none" stroke="#A9462B" stroke-width="1.6"/>
<text x="-146" y="0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#A9462B" font-weight="500" text-anchor="middle" font-style="normal" letter-spacing="1">NO KTX, NO CONTEXT</text></g>
<text x="50" y="168" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" fill="#7A6656" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="1">SOURCES</text><rect x="50" y="182" width="180" height="54" rx="10" fill="#FAF4E9" stroke="#2A1C15" stroke-width="2"/><text x="64" y="206" font-family="Fraunces, Georgia, serif" font-size="16" fill="#2A1C15" font-weight="600" text-anchor="start" font-style="normal">Shopify</text><text x="64" y="225" font-family="'JetBrains Mono', Menlo, monospace" font-size="11.5" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">orders</text><rect x="50" y="248" width="180" height="54" rx="10" fill="#FAF4E9" stroke="#2A1C15" stroke-width="2"/><text x="64" y="272" font-family="Fraunces, Georgia, serif" font-size="16" fill="#2A1C15" font-weight="600" text-anchor="start" font-style="normal">Recharge</text><text x="64" y="291" font-family="'JetBrains Mono', Menlo, monospace" font-size="11.5" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">subscriptions</text><rect x="50" y="314" width="180" height="54" rx="10" fill="#FAF4E9" stroke="#2A1C15" stroke-width="2"/><text x="64" y="338" font-family="Fraunces, Georgia, serif" font-size="16" fill="#2A1C15" font-weight="600" text-anchor="start" font-style="normal">Klaviyo</text><text x="64" y="357" font-family="'JetBrains Mono', Menlo, monospace" font-size="11.5" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">email</text><rect x="50" y="380" width="180" height="54" rx="10" fill="#FAF4E9" stroke="#2A1C15" stroke-width="2"/><text x="64" y="404" font-family="Fraunces, Georgia, serif" font-size="16" fill="#2A1C15" font-weight="600" text-anchor="start" font-style="normal">Ad platforms</text><text x="64" y="423" font-family="'JetBrains Mono', Menlo, monospace" font-size="11.5" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">spend</text><path d="M230 310 L280 310" fill="none" stroke="#2A1C15" stroke-width="2.6" stroke-linejoin="round"/><path d="M280 310L265.0 317.0L265.0 303.0Z" fill="#2A1C15"/><rect x="280" y="150" width="620" height="320" rx="14" fill="#FAF4E9" stroke="#2F5B55" stroke-width="2.6"/><path d="M280 164a14 14 0 0 1 14 -14h592a14 14 0 0 1 14 14v30h-620z" fill="#2F5B55"/><text x="298" y="180" font-family="Fraunces, Georgia, serif" font-size="21" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">Warehouse</text><text x="884" y="180" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5" fill="#D9A441" font-weight="500" text-anchor="end" font-style="normal">built and tested by dbt</text><rect x="296" y="212" width="138" height="64" rx="9" fill="#F4EADB" stroke="#2A1C15" stroke-width="2"/><text x="365.0" y="241.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13.5" fill="#2A1C15" font-weight="600" text-anchor="middle" font-style="normal">raw</text><text x="365.0" y="261.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" fill="#7A6656" font-weight="400" text-anchor="middle" font-style="normal">as loaded</text><rect x="446" y="212" width="138" height="64" rx="9" fill="#F4EADB" stroke="#2A1C15" stroke-width="2"/><text x="515.0" y="241.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13.5" fill="#2A1C15" font-weight="600" text-anchor="middle" font-style="normal">staging</text><text x="515.0" y="261.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" fill="#7A6656" font-weight="400" text-anchor="middle" font-style="normal">cleaned</text><path d="M434 244 L446 244" fill="none" stroke="#2A1C15" stroke-width="2" stroke-linejoin="round"/><path d="M446 244L431.0 251.0L431.0 237.0Z" fill="#2A1C15"/><rect x="596" y="212" width="138" height="64" rx="9" fill="#F4EADB" stroke="#2A1C15" stroke-width="2"/><text x="665.0" y="241.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13.5" fill="#2A1C15" font-weight="600" text-anchor="middle" font-style="normal">intermediate</text><text x="665.0" y="261.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" fill="#7A6656" font-weight="400" text-anchor="middle" font-style="normal">joined</text><path d="M584 244 L596 244" fill="none" stroke="#2A1C15" stroke-width="2" stroke-linejoin="round"/><path d="M596 244L581.0 251.0L581.0 237.0Z" fill="#2A1C15"/><rect x="746" y="212" width="138" height="64" rx="9" fill="#F4EADB" stroke="#2A1C15" stroke-width="2"/><text x="815.0" y="241.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="13.5" fill="#2A1C15" font-weight="600" text-anchor="middle" font-style="normal">marts</text><text x="815.0" y="261.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" fill="#7A6656" font-weight="400" text-anchor="middle" font-style="normal">fct, metrics</text><path d="M734 244 L746 244" fill="none" stroke="#2A1C15" stroke-width="2" stroke-linejoin="round"/><path d="M746 244L731.0 251.0L731.0 237.0Z" fill="#2A1C15"/><text x="296" y="330" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Correct as calculations. Nothing in these</text><text x="296" y="353" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">tables says why a number moved.</text><text x="296" y="448" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">DuckDB in the demo; Snowflake or BigQuery in real life</text><rect x="1290" y="150" width="260" height="190" rx="14" fill="#FAF4E9" stroke="#A9462B" stroke-width="2.6"/><path d="M1290 164a14 14 0 0 1 14 -14h232a14 14 0 0 1 14 14v30h-260z" fill="#A9462B"/><text x="1308" y="180" font-family="Fraunces, Georgia, serif" font-size="21" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">Agent</text><text x="1308" y="222" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Claude, or any agent.</text><text x="1308" y="244" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Writes SQL against the</text><text x="1308" y="266" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">marts and answers.</text><path d="M900 243 L1290 243" fill="none" stroke="#A9462B" stroke-width="2.6" stroke-linejoin="round"/><path d="M1290 243L1275.0 250.0L1275.0 236.0Z" fill="#A9462B"/><rect x="1038.8" y="230" width="112.4" height="25" rx="12.5" fill="#F4EADB" stroke="#A9462B" stroke-width="1.3"/><text x="1095.0" y="247" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5" fill="#A9462B" font-weight="600" text-anchor="middle" font-style="normal">SQL over MCP</text><rect x="1290" y="372" width="260" height="150" rx="14" fill="#FAF4E9" stroke="#A9462B" stroke-width="2.6"/><path d="M1290 386a14 14 0 0 1 14 -14h232a14 14 0 0 1 14 14v30h-260z" fill="#A9462B"/><text x="1308" y="402" font-family="Fraunces, Georgia, serif" font-size="21" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">BI tool</text><text x="1308" y="440" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5" fill="#A9462B" font-weight="600" text-anchor="start" font-style="normal">e.g. Omni, Lightdash</text><text x="1308" y="466" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Dashboards, board pack.</text><text x="1308" y="485" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">Brings its own model,</text><text x="1308" y="504" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">AI notes and usage data.</text><path d="M900 452 L1290 452" fill="none" stroke="#A9462B" stroke-width="2.6" stroke-linejoin="round"/><path d="M1290 452L1275.0 459.0L1275.0 445.0Z" fill="#A9462B"/><rect x="1027.25" y="439" width="135.5" height="25" rx="12.5" fill="#F4EADB" stroke="#A9462B" stroke-width="1.3"/><text x="1095.0" y="456" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5" fill="#A9462B" font-weight="600" text-anchor="middle" font-style="normal">reads the marts</text><rect x="280" y="540" width="620" height="170" rx="14" fill="#FAF4E9" stroke="#2A1C15" stroke-width="2.6"/><path d="M280 554a14 14 0 0 1 14 -14h592a14 14 0 0 1 14 14v30h-620z" fill="#2A1C15"/><text x="298" y="570" font-family="Fraunces, Georgia, serif" font-size="21" fill="#F4EADB" font-weight="600" text-anchor="start" font-style="normal">The team&#x27;s git repo</text><text x="298" y="614" font-family="'JetBrains Mono', Menlo, monospace" font-size="15" fill="#2A1C15" font-weight="600" text-anchor="start" font-style="normal">dbt models and tests</text><text x="298" y="638" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">staging, intermediate, marts,</text><text x="298" y="658" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">column descriptions, tests</text><path d="M440 540 L440 470" fill="none" stroke="#2A1C15" stroke-width="2.6" stroke-linejoin="round"/><path d="M440 470L447.0 485.0L433.0 485.0Z" fill="#2A1C15"/><rect x="395.35" y="492" width="89.3" height="25" rx="12.5" fill="#F4EADB" stroke="#2A1C15" stroke-width="1.3"/><text x="440.0" y="509" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5" fill="#2A1C15" font-weight="600" text-anchor="middle" font-style="normal">dbt build</text><text x="606" y="614" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">The reasons behind the numbers</text><text x="606" y="636" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">live in people&#x27;s heads, Slack</text><text x="606" y="658" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">threads and a wiki page.</text><text x="50" y="790" font-family="Caveat, 'Bradley Hand', cursive" font-size="28" fill="#A9462B" font-weight="600" text-anchor="start" font-style="normal">Every reader works out what the numbers mean on its own.</text>
<text x="60" y="878" font-family="'JetBrains Mono', Menlo, monospace" font-size="13.5" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">Both query the marts directly: the agent has only table and column names to go on, the BI tool only its own model.</text>
</svg>
