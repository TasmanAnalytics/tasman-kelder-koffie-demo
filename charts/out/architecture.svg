t-size="13.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">the marts. Sources map</text><text x="66" y="619.0" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">into it once. Everything</text><text x="66" y="638.5" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">downstream, including</text><text x="66" y="658.0" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">ktx, Omni and the</text><text x="66" y="677.5" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#2A1C15" font-weight="400" text-anchor="start" font-style="normal">agent, reads from it.</text><rect x="60" y="832" width="34" height="16" rx="4" fill="none" stroke="#2A1C15" stroke-width="2"/><text x="102" y="845" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">built in this repository</text><rect x="320" y="832" width="34" height="16" rx="4" fill="none" stroke="#A9462B" stroke-width="2" stroke-dasharray="5 4"/><text x="362" y="845" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5" fill="#7A6656" font-weight="400" text-anchor="start" font-style="normal">design or illustration, not in the demo</text>
